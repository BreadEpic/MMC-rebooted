            {n:"Plague", d:"Enemies explode into poison.", r:'epic', cond:()=>getC("Plague")<10, f:()=>{player.plague = true; player.counts["Plague"]=getC("Plague")+1;}},
            {n:"Kill Streak", d:"Stack dmg on kill.", r:'epic', cond:()=>getC("Kill Streak")<10, f:()=>{player.killStreakTimer = 1; player.counts["Kill Streak"]=getC("Kill Streak")+1;}},
            {n:"Shockwave", d:"Push enemies when hit.", r:'epic', cond:()=>getC("Shockwave")<10, f:()=>{player.shockwave = true; player.counts["Shockwave"]=getC("Shockwave")+1;}},
            {n:"Last Stand", d:"+50% Dmg at low HP.", r:'epic', cond:()=>getC("Last Stand")<10, f:()=>{player.lastStand = true; player.counts["Last Stand"]=getC("Last Stand")+1;}},
            {n:"Auto Repair", d:"Heal 1HP/10s.", r:'epic', cond:()=>getC("Auto Repair")<5, f:()=>{player.autoRepair = true; player.counts["Auto Repair"]=getC("Auto Repair")+1;}}, // Time
            {n:"Lucky Charm", d:"2x Heart Drops.", r:'epic', cond:()=>getC("Lucky Charm")<5, f:()=>{player.luckyCharm = true; player.counts["Lucky Charm"]=getC("Lucky Charm")+1;}}, // Chance
            {n:"Tesla Coil", d:"Zap enemies every 3s.", r:'epic', cond:()=>getC("Tesla Coil")<5, f:()=>{player.tesla = true; player.counts["Tesla Coil"]=getC("Tesla Coil")+1;}}, // Time
            {n:"Sawblade", d:"Melee orbital.", r:'epic', cond:()=>getC("Sawblade")<10, f:()=>{player.sawblade = true; player.counts["Sawblade"]=getC("Sawblade")+1;}},
            {n:"Bombardier", d:"10% Chance grenade.", r:'epic', cond:()=>getC("Bombardier")<5, f:()=>{player.bombardier = true; player.counts["Bombardier"]=getC("Bombardier")+1;}}, // Chance
            {n:"Big Berthat", d:"Dmg +40%, Size +.", r:'epic', cond:()=>getC("Big Berthat")<10, f:()=>{player.dmg*=1.4; player.caliber=true; player.counts["Big Berthat"]=getC("Big Berthat")+1;}},
            {n:"Machine Gun", d:"Fire Rate +40%.", r:'epic', cond:()=>getC("Machine Gun")<10, f:()=>{player.fireRate*=0.6; player.counts["Machine Gun"]=getC("Machine Gun")+1;}},
            {n:"Sniper Rifle", d:"Range/Dmg ++, Rate --.", r:'epic', cond:()=>getC("Sniper Rifle")<10, f:()=>{player.dmg*=1.5; player.fireRate*=1.2; player.counts["Sniper Rifle"]=getC("Sniper Rifle")+1;}},
            {n:"Shield Generator", d:"Shield Regen faster.", r:'epic', cond:()=>getC("Shield Generator")<5, f:()=>{player.shieldMax=true; player.counts["Shield Generator"]=getC("Shield Generator")+1;}},
            {n:"Vampire Blood", d:"Heal on kill chance ++.", r:'epic', cond:()=>getC("Vampire Blood")<5, f:()=>{player.vampire=true; player.counts["Vampire Blood"]=getC("Vampire Blood")+1;}},
            {n:"Ghost Protocol", d:"Dodge chance ++.", r:'epic', cond:()=>getC("Ghost Protocol")<5, f:()=>{player.blink=true; player.counts["Ghost Protocol"]=getC("Ghost Protocol")+1;}},
            {n:"Ice Age", d:"Freeze on hit.", r:'epic', cond:()=>getC("Ice Age")<5, f:()=>{player.cryo=true; player.freezeOnKill=true; player.counts["Ice Age"]=getC("Ice Age")+1;}},
            {n:"Explosive Personality", d:"Explosive + Cluster.", r:'epic', cond:()=>getC("Explosive Personality")<5, f:()=>{player.explosive=true; player.cluster=true; player.counts["Explosive Personality"]=getC("Explosive Personality")+1;}},
            {n:"Tesla Suit", d:"Tesla + Static.", r:'epic', cond:()=>getC("Tesla Suit")<5, f:()=>{player.tesla=true; player.static=true; player.counts["Tesla Suit"]=getC("Tesla Suit")+1;}},
            {n:"Guardian", d:"Drone + Turret.", r:'epic', cond:()=>getC("Guardian")<5, f:()=>{player.drone=true; player.turret=true; player.counts["Guardian"]=getC("Guardian")+1;}},

            // LEGENDARY (5% Chance)
            {n:"NECROMANCER", d:`Raise dead (Lvl ${player.necro+1}). Max 5.`, r:'legendary', cond:()=>getC("NECROMANCER")<10, f:()=>{player.necro++; player.counts["NECROMANCER"]=getC("NECROMANCER")+1;}}, // Level based
            {n:"Juggernaut", d:"MaxHP++++ Dmg--", r:'legendary', cond:()=>getC("Juggernaut")<10, f:()=>{player.maxHp+=50; player.hp+=50; player.dmg*=0.7; player.counts["Juggernaut"]=getC("Juggernaut")+1;}},
            {n:"Glass Cannon", d:"Dmg+++ MaxHP--", r:'legendary', cond:()=>getC("Glass Cannon")<10, f:()=>{player.dmg*=1.3; player.maxHp=Math.max(20, player.maxHp*0.7); player.hp=Math.min(player.hp, player.maxHp); player.counts["Glass Cannon"]=getC("Glass Cannon")+1;}},
            {n:"Full Restore", d:"Heal 100%", r:'legendary', cond:()=>getC("Full Restore")<10, f:()=>{player.hp=player.maxHp; player.counts["Full Restore"]=getC("Full Restore")+1;}},
            {n:"Life Steal", d:"Small chance to heal 5HP.", r:'legendary', cond:()=>getC("Life Steal")<10, f:()=>{player.lifeSteal = true; player.counts["Life Steal"]=getC("Life Steal")+1;}},
            {n:"Meteor", d:"Rain fire from sky.", r:'legendary', cond:()=>getC("Meteor")<10, f:()=>{player.meteor = true; player.counts["Meteor"]=getC("Meteor")+1;}},
            {n:"Phoenix", d:"Revive once (WIP).", r:'legendary', cond:()=>getC("Phoenix")<10, f:()=>{player.phoenix = true; player.lives = (player.lives||0)+1; player.counts["Phoenix"]=getC("Phoenix")+1;}}, 
            {n:"Regeneration", d:"Heal over time.", r:'legendary', cond:()=>getC("Regeneration")<10, f:()=>{player.regen++; player.counts["Regeneration"]=getC("Regeneration")+1;}},
            {n:"Super Nova", d:"Explode when hit.", r:'legendary', cond:()=>getC("Super Nova")<10, f:()=>{player.nova = true; player.counts["Super Nova"]=getC("Super Nova")+1;}},
            {n:"Death Ray", d:"Fire a massive beam.", r:'legendary', cond:()=>getC("Death Ray")<10, f:()=>{player.deathRay = true; player.counts["Death Ray"]=getC("Death Ray")+1;}},
            {n:"Time Stop", d:"Freeze time on hit.", r:'legendary', cond:()=>getC("Time Stop")<5, f:()=>{player.timeStop = true; player.counts["Time Stop"]=getC("Time Stop")+1;}}, // Time
            {n:"Singularity", d:"Shots pull enemies.", r:'legendary', cond:()=>getC("Singularity")<10, f:()=>{player.singularity = true; player.counts["Singularity"]=getC("Singularity")+1;}},
            {n:"Divine Shield", d:"Block 1 hit/5s.", r:'legendary', cond:()=>getC("Divine Shield")<5, f:()=>{player.divine = true; player.counts["Divine Shield"]=getC("Divine Shield")+1;}}, // Time
            {n:"Soul Eater", d:"Kill = +1 MaxHP.", r:'legendary', cond:()=>getC("Soul Eater")<10, f:()=>{player.soulEater = true; player.counts["Soul Eater"]=getC("Soul Eater")+1;}},
            {n:"God Stats", d:"All stats +20%.", r:'legendary', cond:()=>getC("God Stats")<10, f:()=>{player.dmg*=1.2; player.maxHp*=1.2; player.hp*=1.2; player.speed*=1.2; player.fireRate*=0.8; player.counts["God Stats"]=getC("God Stats")+1;}},
            {n:"Unstoppable", d:"Max HP +200.", r:'legendary', cond:()=>getC("Unstoppable")<10, f:()=>{player.maxHp+=200; player.hp+=200; player.counts["Unstoppable"]=getC("Unstoppable")+1;}},
            {n:"Hyperspeed", d:"Speed/Rate +50%.", r:'legendary', cond:()=>getC("Hyperspeed")<10, f:()=>{player.speed*=1.5; player.fireRate*=0.5; player.counts["Hyperspeed"]=getC("Hyperspeed")+1;}},
            {n:"Devastator", d:"Dmg +100%, Rate -20%.", r:'legendary', cond:()=>getC("Devastator")<10, f:()=>{player.dmg*=2; player.fireRate*=1.2; player.counts["Devastator"]=getC("Devastator")+1;}},
            {n:"Bullet Hell", d:"Multishot +2.", r:'legendary', cond:()=>getC("Bullet Hell")<10, f:()=>{player.ms+=2; player.counts["Bullet Hell"]=getC("Bullet Hell")+1;}},

            // MYTHIC (0.1% Chance)
            {n:"MR FROG", d:"STATS x5. FANCY HAT.", r:'mythic', cond:()=>getC("MR FROG")<10, f:()=>{
                player.mrFrog = true;
                player.dmg *= 5; // Quintuple
                player.maxHp += 500;
                player.hp += 500;
                player.fireRate = 2; 
                player.magnet += 50;
                player.crit = 0.5; // 50% crit
                player.pierce += 10;
                player.knockback += 20;
                player.regen += 5;
                player.counts["MR FROG"]=getC("MR FROG")+1;
            }},
            {n:"SUGAR OVERDOSE", d:"SPEED +200%. HYPERACTIVE.", r:'mythic', cond:()=>getC("SUGAR OVERDOSE")<10, f:()=>{
                player.speed *= 3;
                player.sugarOverdose = true;
                player.counts["SUGAR OVERDOSE"]=getC("SUGAR OVERDOSE")+1;
            }}
        ];
        
        // Filter pool based on both conditions
        let uniqueCount = Object.keys(player.counts).length;
        
        if (uniqueCount >= 10) { // CAP reduced to 10
             allUpgrades = allUpgrades.filter(u => player.counts[u.n] && player.counts[u.n] > 0);
        }

        let pool = allUpgrades.filter(u => !u.cond || u.cond());
        
        if(pool.length === 0) {
            upgradeContainer.innerHTML = "";
            let d = document.createElement('div');
            d.className = 'upgrade-card';
            d.style.borderColor = '#0ff';
            d.innerHTML = `<h3>FULL RESTORE</h3><span>Maxed out! Heal & Continue.</span>`;
            d.onclick = () => {
                player.hp = player.maxHp;
                floor++;
                state = 'PLAY';
                overlay.classList.add('hidden');
                upgradeContainer.classList.add('hidden');
                rerollBtn.classList.add('hidden');
                loadLevel();
                loop();
            };
            upgradeContainer.appendChild(d);
            return;
        }

        let choices = [];
        for(let i=0; i<3; i++) {
            if(pool.length === 0) break;

            let rand = Math.random();
            let tier = 'common';
            
            if(rand < 0.001) tier = 'mythic';
            else if(rand < 0.011) tier = 'legendary'; 
            else if(rand < 0.061) tier = 'epic'; 
            else if(rand < 0.361) tier = 'rare'; 
            else tier = 'common'; // 64%
            
            let tierPool = pool.filter(u => u.r === tier);
            if(tierPool.length === 0) tierPool = pool;

            let choice = tierPool[Math.floor(Math.random() * tierPool.length)];
            choices.push(choice);
            pool = pool.filter(u => u !== choice);
        }

        upgradeContainer.innerHTML = "";
        
        choices.forEach(o => {
            let color = '#fff'; 
            let glow = '#fff';
            let animClass = '';

            if(o.r === 'rare') { color = '#0af'; glow = '#0af'; }
            if(o.r === 'epic') { color = '#b0f'; glow = '#b0f'; }
            if(o.r === 'legendary') { color = '#fa0'; glow = '#fa0'; }
            if(o.r === 'mythic') { color = '#fff'; glow = 'transparent'; animClass = 'rainbow'; }

            let d = document.createElement('div'); 
            d.className = 'upgrade-card'; 
            d.style.borderColor = color;
            d.style.boxShadow = `0 0 10px ${glow}`;
            if(animClass) d.style.animation = "rainbow 2s linear infinite";
            
            d.innerHTML = `
                <h3 style="color:${color}">${o.n}</h3>
                <span style="color:#ddd">${o.d}</span>
                <div style="margin-top:8px; font-size:10px; color:${color}; opacity:0.8;">${o.r.toUpperCase()}</div>
            `;
            
            d.onclick = ()=>{ 
                let previouslyOwned = player.counts[o.n];
                o.f(); 
                if(!previouslyOwned) player.upgradeCount++; 
                updateUpgradeList(); 
                floor++; 
                state = 'PLAY'; 
                overlay.classList.add('hidden'); 
                upgradeContainer.classList.add('hidden');
                rerollBtn.classList.add('hidden');
                loadLevel(); 
                loop(); 
            };
            upgradeContainer.appendChild(d);
        });
    }

    function endGame(win) {
        if(!win && player.phoenix && player.lives > 0) {
            player.lives--;
            player.hp = player.maxHp;
            shake = 20;
            spawnFloatText(player.x, player.y, "PHOENIX REVIVE", "#fa0");
            particles.push({x:player.x, y:player.y, vx:0, vy:0, c:'#fa0', l:5, s:100});
            return;
        }
        
        state='OVER';
        overlay.classList.remove('hidden'); upgradeContainer.classList.add('hidden'); rerollBtn.classList.add('hidden'); startBtn.classList.remove('hidden');
        title.innerText = win ? "VICTORY" : "FAILURE"; title.style.color = win ? "#0f0" : "#f00"; startBtn.innerText = "RESTART";
    }

    startBtn.onclick = startGame;
    startBtn.ontouchstart = (e) => { e.preventDefault(); startGame(); };

</script>
</body>
</html>
