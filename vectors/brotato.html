<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bro-Tato 2.0</title>
    <link rel="stylesheet" href="v2/fonts.css">
    <style>
        

        :root {
            --glass: rgba(20, 20, 25, 0.9);
            --border: rgba(255, 255, 255, 0.15);
            --neon-blue: #00f3ff;
            --neon-red: #ff0055;
            --neon-gold: #ffd700;
            --neon-green: #2ecc71;
            --neon-purple: #9b59b6;
            --neon-orange: #ff9f43;
        }

        body {
            margin: 0;
            background: #050505;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            background-image: radial-gradient(circle at center, #1a1a20 0%, #000 100%);
        }

        #scaler {
            transform-origin: center center;
            transition: transform 0.2s;
        }

        #mainLayout {
            display: grid;
            grid-template-columns: 1fr; /* Starts as 1 screen */
            justify-items: center;
            gap: 20px;
            align-items: center;
            opacity: 0;
            animation: fadeIn 1s forwards;
            position: relative;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        .sidebar {
            height: 800px; /* Matched to new game height */
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: none; /* Hidden by default, shown in shop */
            flex-direction: column;
            overflow-y: auto;
            backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,243,255,0.05);
            position: relative;
            z-index: 100;
        }
        
        .sidebar::before {
            content: ''; position: absolute; top:0; left:0; right:0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--neon-blue), transparent);
            opacity: 0.8;
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .sidebar-title {
            text-align: center;
            font-family: 'Black Ops One';
            font-size: 22px;
            color: #ccc;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            flex-shrink: 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* ICONS */
        .icon-box {
            width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            margin-right: 10px;
            border: 1px solid #444;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .icon-box svg { width: 28px; height: 28px; filter: drop-shadow(0 0 8px rgba(255,255,255,0.5)); }

        /* WEAPON SLOTS */
        .weapon-slot {
            background: rgba(30, 30, 35, 0.6);
            border: 1px solid #444;
            margin-bottom: 12px;
            padding: 10px;
            border-radius: 6px;
            position: relative;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }
        
        .weapon-header { display: flex; align-items: center; margin-bottom: 5px; }

        .weapon-slot.tier-0 { border-left: 4px solid #95a5a6; } 
        .weapon-slot.tier-1 { border-left: 4px solid #00f3ff; box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.1); } 
        .weapon-slot.tier-2 { border-left: 4px solid #d500f9; box-shadow: inset 0 0 15px rgba(213, 0, 249, 0.1); } 
        .weapon-slot.tier-3 { border-left: 4px solid #ff0055; box-shadow: inset 0 0 15px rgba(255, 0, 85, 0.1); }

        .wep-name { font-weight: 700; font-size: 16px; letter-spacing: 1px; flex: 1; }
        .wep-stats { font-size: 12px; color: #888; font-family: monospace; margin-left: 50px; }
        .wep-desc { font-size: 11px; color: #aaa; margin-top: 4px; margin-left: 50px; font-style: italic; }

        /* ITEM SLOTS */
        .item-slot {
            display: flex; align-items: center;
            background: rgba(255,255,255,0.05);
            margin-bottom: 8px; padding: 8px;
            border-radius: 4px; border: 1px solid #333;
        }
        .item-info { display: flex; flex-direction: column; }
        .item-name { font-weight: bold; font-size: 14px; color: var(--neon-green); }
        .item-desc { font-size: 11px; color: #aaa; }

        .slot-actions { display: flex; gap: 8px; margin-top: 5px; padding-left: 50px; }
        
        .btn-mini {
            flex: 1; border: none; padding: 4px; font-size: 10px;
            cursor: pointer; font-weight: bold; color: white;
            border-radius: 4px; text-transform: uppercase;
            font-family: 'Rajdhani'; letter-spacing: 1px;
            transition: 0.2s;
        }
        .btn-sell { background: rgba(192, 57, 43, 0.2); border: 1px solid #c0392b; color: #e74c3c; }
        .btn-sell:hover { background: #c0392b; color: white; box-shadow: 0 0 10px #c0392b; }
        
        .btn-merge { 
            background: linear-gradient(45deg, #00b09b, #96c93d); 
            border: none; color: #000;
            box-shadow: 0 0 10px rgba(150, 201, 61, 0.5);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1); } }

        /* GAME AREA - EXPANDED */
        #gameWrapper {
            position: relative;
            box-shadow: 0 0 100px rgba(0,0,0,0.9), 0 0 20px rgba(0,243,255,0.1);
            border-radius: 12px;
            overflow: hidden;
            width: 1200px; /* INCREASED SIZE */
            height: 800px; /* INCREASED SIZE */
            background: #08080a;
            border: 1px solid #333;
            z-index: 50;
        }

        canvas { display: block; }

        #uiLayer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; padding: 30px; box-sizing: border-box;
            z-index: 5;
        }

        .hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .hp-bar-bg {
            width: 350px; height: 30px; background: rgba(0,0,0,0.9);
            border: 2px solid #555; border-radius: 6px; overflow: hidden; position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .hp-bar-fill {
            height: 100%; background: linear-gradient(90deg, #c0392b, #ff4757);
            width: 100%; transition: width 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 15px #ff4757;
        }
        .hp-text {
            position: absolute; width: 100%; text-align: center; top:0;
            font-size: 18px; line-height: 30px; font-weight: bold;
            text-shadow: 2px 2px 4px black; letter-spacing: 1px;
        }

        .mats-display {
            font-size: 38px; color: var(--neon-blue); font-weight: 800;
            text-shadow: 0 0 20px var(--neon-blue); font-family: 'Rajdhani';
            background: rgba(0,0,0,0.7); padding: 5px 20px; border-radius: 8px;
            border: 1px solid rgba(0, 243, 255, 0.4);
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        
        .wave-timer {
            font-size: 52px; color: var(--neon-gold);
            font-family: 'Black Ops One';
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
        }

        /* BOSS BAR */
        #bossBarContainer {
            position: absolute;
            top: 80px; left: 50%; transform: translateX(-50%);
            width: 600px; height: 25px;
            background: #111; border: 2px solid #fff;
            border-radius: 12px; overflow: hidden;
            display: none;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
        }
        #bossBarFill {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #8e44ad, #ff0055);
            transition: width 0.1s;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.5);
        }

        /* PAUSE OVERLAY */
        #pauseScreen {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Black Ops One';
            font-size: 80px;
            text-shadow: 0 0 40px var(--neon-blue);
            z-index: 200;
        }

        /* OVERLAYS */
        #menuOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 8, 0.98);
            backdrop-filter: blur(8px);
            z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.3s;
            pointer-events: auto;
        }
        
        .hidden { display: none !important; }

        /* MODIFIED SHOP LAYOUT */
        .shop-container {
            display: flex;
            width: 95%;
            height: 85%;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
        }

        .shop-left-col {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .shop-grid {
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 20px;
            margin: 20px 0;
            width: 100%;
            max-width: 500px;
        }

        .shop-stats {
            flex: 1;
            min-width: 250px;
            background: rgba(255,255,255,0.05);
            border: 1px solid #444;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            height: fit-content;
            margin-top: 40px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 4px; font-size: 16px; }
        .stat-lbl { color: #aaa; }
        .stat-val { color: var(--neon-gold); font-weight: bold; text-shadow: 0 0 5px var(--neon-gold); }
        
        .shop-card {
            background: radial-gradient(circle at top left, rgba(50, 55, 60, 0.95), rgba(20, 25, 30, 0.95));
            border: 1px solid #444; width: 100%;
            border-radius: 8px; padding: 15px; text-align: center;
            cursor: pointer; position: relative; transition: 0.2s;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 0 5px 20px rgba(0,0,0,0.4);
            display: flex; flex-direction: column; align-items: center;
            box-sizing: border-box;
        }
        .shop-card:hover { transform: translateY(-5px); border-color: var(--neon-gold); box-shadow: 0 0 25px rgba(255, 215, 0, 0.5); }
        .shop-card.locked { border-color: #f39c12; box-shadow: 0 0 20px rgba(243, 156, 18, 0.4); }
        .shop-card.bought { opacity: 0.2; pointer-events: none; filter: grayscale(1); }
        .shop-card.expensive { opacity: 0.5; filter: grayscale(0.5); }
        
        .shop-card.tier-0 { border-color: #95a5a6; }
        .shop-card.tier-1 { border-color: #00f3ff; box-shadow: inset 0 0 20px rgba(0,243,255,0.2), 0 5px 15px rgba(0,0,0,0.4); }
        .shop-card.tier-2 { border-color: #d500f9; box-shadow: inset 0 0 25px rgba(213,0,249,0.3), 0 5px 15px rgba(0,0,0,0.4); }
        .shop-card.tier-3 { border-color: #ff0055; box-shadow: inset 0 0 30px rgba(255,0,85,0.4), 0 5px 15px rgba(0,0,0,0.4); }
        
        .lock-btn {
            position: absolute; top: -12px; right: -12px;
            background: #222; border: 2px solid #555;
            border-radius: 50%; width: 34px; height: 34px;
            display: flex; justify-content: center; align-items: center;
            font-size: 16px; cursor: pointer; transition: 0.2s;
            z-index: 10;
        }
        .lock-btn:hover { border-color: var(--neon-gold); transform: scale(1.1); box-shadow: 0 0 10px var(--neon-gold); }

        .btn {
            background: var(--neon-red); border: none; padding: 15px 45px;
            font-size: 26px; color: white; border-radius: 6px; cursor: pointer;
            font-family: 'Black Ops One'; margin: 10px;
            text-transform: uppercase;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
            transition: 0.2s;
        }
        .btn:hover { transform: scale(1.05); filter: brightness(1.2); }
        .btn-blue { background: var(--neon-blue); box-shadow: 0 0 25px rgba(0, 243, 255, 0.5); color: #000; }
        .btn-green { background: var(--neon-green); box-shadow: 0 0 25px rgba(46, 204, 113, 0.5); color: #000; }

        .shop-wallet {
            font-size: 32px; color: var(--neon-blue); font-weight: bold;
            margin-bottom: 15px; border: 2px solid var(--neon-blue);
            padding: 8px 25px; border-radius: 20px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            background: rgba(0,0,0,0.5);
        }

        .shop-item-desc {
            font-size: 12px;
            color: #ccc;
            margin: 8px 0;
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #111; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
        ::-webkit-scrollbar-thumb:hover { background: #666; }
    </style>
</head>
<body>

<div id="scaler">
    <div id="mainLayout">
        <div class="sidebar" id="sidebarLeft">
            <div class="sidebar-title">ARSENAL (MAX 6)</div>
            <div id="weaponList"></div>
        </div>

        <div id="gameWrapper">
            <canvas id="gameCanvas" width="1200" height="800"></canvas>
            
            <div id="uiLayer">
                <div class="hud-top">
                    <div class="hp-bar-bg">
                        <div id="hpFill" class="hp-bar-fill"></div>
                        <div id="hpText" class="hp-text">20/20</div>
                    </div>
                    
                    <div id="bossBarContainer">
                        <div id="bossBarFill"></div>
                    </div>

                    <div class="wave-timer" id="gameTimer">30</div>
                    <div class="mats-display">
                        <div>$ <span id="matCount">0</span></div>
                    </div>
                </div>
            </div>

            <div id="pauseScreen">PAUSED</div>

            <div id="menuOverlay">
                <div id="startScreen" style="text-align:center">
                    <h1 style="font-size:100px; color:var(--neon-gold); font-family:'Black Ops One'; margin:0; text-shadow: 0 0 40px rgba(255,215,0,0.6);">BRO-TATO</h1>
                    <h3 style="color:#aaa; letter-spacing:6px; margin-top:0; font-size: 24px;">EXPLOSIVE CHAOS UPDATE</h3>
                    <button class="btn" onclick="Game.start()" style="padding: 20px 60px; font-size: 32px; margin-top: 20px;">INITIALIZE</button>
                </div>

                <div id="shopScreen" class="hidden" style="text-align:center; width:100%;">
                    <h1 style="margin:0; font-family:'Black Ops One'; font-size: 60px; text-shadow: 0 0 30px rgba(255,255,255,0.3);">SUPPLY DROP</h1>
                    <div class="shop-wallet" style="display:inline-block;">MONEY: $<span id="shopMoney">0</span></div>
                    
                    <div class="shop-container">
                        <div class="shop-left-col">
                            <div style="color:#888; font-size:18px; margin-top:5px; font-weight: bold; letter-spacing: 2px;">WEAPONS & ITEMS</div>
                            <div id="shopGrid" class="shop-grid"></div>
                            <div style="margin-top: 10px;">
                                <button class="btn btn-blue" onclick="Shop.reroll()">REROLL (5)</button>
                                <button class="btn" onclick="Shop.nextWave()">NEXT WAVE</button>
                            </div>
                        </div>

                        <div class="shop-stats">
                            <h3 style="margin:0 0 20px 0; color:var(--neon-blue); border-bottom:2px solid #444; padding-bottom: 10px; font-size: 24px;">COMBAT STATS</h3>
                            <div id="statList"></div>
                        </div>
                    </div>
                </div>

                <div id="gameOverScreen" class="hidden" style="text-align:center">
                    <h1 style="color:var(--neon-red); font-family:'Black Ops One'; font-size:80px; text-shadow: 0 0 50px var(--neon-red);">CRITICAL FAILURE</h1>
                    <h3 id="deathText" style="color:#fff; font-size: 30px; letter-spacing: 3px;">Wave 1</h3>
                    <button class="btn" onclick="location.reload()" style="margin-top: 30px;">REBOOT SYSTEM</button>
                </div>
            </div>
        </div>

        <div class="sidebar" id="sidebarRight">
            <div class="sidebar-title">PASSIVES</div>
            <div id="itemList"></div>
        </div>
    </div>
</div>

<script src="v2/vfx.js"></script>
<script>
function resizeGame() {
    const scaler = document.getElementById('scaler');
    // When in shop, layout needs more width (280 + 1200 + 280 + gap). When playing, just 1200.
    const layoutW = Game.state === 'SHOP' ? 1800 : 1240; 
    const layoutH = 850;
    const windowW = window.innerWidth;
    const windowH = window.innerHeight;
    const scale = Math.min(windowW / layoutW, windowH / layoutH) * 0.95;
    scaler.style.transform = `scale(${scale})`;
}
window.addEventListener('resize', resizeGame);

// SOUND SYSTEM
const Sound = {
    ctx: null,
    init() {
        window.AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
    },
    play(type) {
        if (!this.ctx) return;
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        const now = this.ctx.currentTime;
        if (type === 'shoot') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(100, now + 0.05);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'kill') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(100, now);
            osc.frequency.exponentialRampToValueAtTime(20, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'collect') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1000, now);
            osc.frequency.linearRampToValueAtTime(1500, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.1);
            osc.frequency.setValueAtTime(800, now + 0.2);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
        }
    }
};

// KEYBOARD LISTENER - DEV MODE & PAUSE
window.addEventListener('keydown', e => {
    if(e.key === '?') Game.activateDevMode();
    if(e.key === 'p' || e.key === 'P') Game.togglePause();
});const ICONS = {
    // WEAPONS
    Pistol: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><path d="M20 60 L20 80 L40 80 L45 60 L85 60 L85 45 L40 45 Z" /><circle cx="60" cy="52" r="3" /></svg>`,
    SMG: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><path d="M15 50 L15 75 L35 75 L40 50 L85 50 L85 35 L30 35 Z" /><rect x="50" y="50" width="10" height="20" /><line x1="60" y1="35" x2="85" y2="35" /></svg>`,
    Shotgun: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><path d="M10 55 L30 55 L35 65 L45 65 L50 55 L90 55 L90 45 L30 45 L10 55 Z" /><line x1="50" y1="50" x2="90" y2="50" /></svg>`,
    Wand: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><line x1="20" y1="80" x2="80" y2="20" /><circle cx="80" cy="20" r="10" stroke="cyan" /><path d="M70 10 L90 30 M90 10 L70 30" stroke="cyan" stroke-width="2" /></svg>`,
    Rocket: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><rect x="25" y="40" width="50" height="20" rx="5" /><path d="M75 40 L90 30 L90 70 L75 60" fill="currentColor"/><path d="M25 40 L10 30 L10 70 L25 60" /></svg>`,
    Sniper: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><rect x="10" y="45" width="80" height="10" /><rect x="20" y="55" width="10" height="15" /><line x1="10" y1="45" x2="90" y2="45" stroke-dasharray="4" /><rect x="50" y="35" width="20" height="10" /></svg>`,
    Minigun: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><rect x="30" y="35" width="50" height="30" /><rect x="10" y="40" width="20" height="20" /><circle cx="55" cy="50" r="5" /><line x1="80" y1="40" x2="95" y2="40" /><line x1="80" y1="50" x2="95" y2="50" /><line x1="80" y1="60" x2="95" y2="60" /></svg>`,
    Katana: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><path d="M20 80 Q50 50 80 20" stroke-width="8" stroke-linecap="round" /><rect x="20" y="75" width="15" height="15" fill="#333" transform="rotate(-45 27.5 82.5)" /></svg>`,

class Explosion {
    constructor(x, y, radius, col) {
        this.x = x; this.y = y; this.maxR = radius; this.r = 0; this.col = col; this.life = 1.0;
    }
    update(dt) {
        this.r += (this.maxR - this.r) * 15 * dt;
        this.life -= dt * 3;
    }
    draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.shadowBlur = 20; ctx.shadowColor = this.col;
        ctx.fillStyle = this.col;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r*0.6, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

class EnemyHomingProjectile {
    constructor(x, y, dmg) {
        this.x = x; this.y = y;
        this.dmg = dmg;
        this.speed = 100;
        this.life = 10.0;
        this.dead = false;
        this.r = 8;
    }
    update(dt) {
        this.life -= dt;
        if (this.life <= 0) this.dead = true;
        
        let px = Game.player.x;
        let py = Game.player.y;
        let angle = Math.atan2(py - this.y, px - this.x);
        
        this.x += Math.cos(angle) * this.speed * dt;
        this.y += Math.sin(angle) * this.speed * dt;
        
        let d = Math.hypot(px - this.x, py - this.y);
        if (d < this.r + Game.player.r && !Game.player.invincible) {
            let dmgTaken = Math.max(1, this.dmg - Game.player.armor);
            Game.player.hp -= dmgTaken;
            Game.shake = 5;
            Sound.play('hit');
            this.dead = true;
            if(Game.player.hp <= 0) Game.state = 'OVER';
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.shadowBlur = 10; ctx.shadowColor = '#e74c3c';
        ctx.fillStyle = '#ff0000';
        ctx.beginPath(); ctx.arc(0,0, this.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(0,0, this.r*0.5, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }
}

const AdvancedFX = {
    particles: [],
    generateDust() {
        for(let i=0; i<150; i++) {
            this.particles.push({
                x: Math.random() * C.width,
                y: Math.random() * C.height,
                vx: (Math.random()-0.5)*10,
                vy: (Math.random()-0.5)*10,
                size: Math.random()*2,
                alpha: Math.random()*0.5
            });
        }
    },
    ground: null,
    buildGround(w, h) {
        const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
        let g = x.createRadialGradient(w / 2, h / 2, 50, w / 2, h / 2, Math.max(w, h) * 0.7); g.addColorStop(0, '#3a2f24'); g.addColorStop(0.6, '#2a221a'); g.addColorStop(1, '#16120e');
        x.fillStyle = g; x.fillRect(0, 0, w, h);
        for (let i = 0; i < 14000; i++) { x.fillStyle = Math.random() < 0.5 ? 'rgba(255,230,190,0.035)' : 'rgba(0,0,0,0.08)'; const r = Math.random() * 2 + 0.5; x.fillRect(Math.random() * w, Math.random() * h, r, r); }
        for (let i = 0; i < 26; i++) { const cx = Math.random() * w, cy = Math.random() * h, r = 40 + Math.random() * 110; const pg = x.createRadialGradient(cx, cy, 2, cx, cy, r); pg.addColorStop(0, 'rgba(90,70,45,0.22)'); pg.addColorStop(1, 'rgba(90,70,45,0)'); x.fillStyle = pg; x.fillRect(cx - r, cy - r, r * 2, r * 2); }
        x.strokeStyle = 'rgba(0,0,0,0.35)'; x.lineWidth = 1.5;
        for (let i = 0; i < 18; i++) { let px = Math.random() * w, py = Math.random() * h; x.beginPath(); x.moveTo(px, py); for (let k = 0; k < 5; k++) { px += (Math.random() - 0.5) * 50; py += (Math.random() - 0.5) * 50; x.lineTo(px, py); } x.stroke(); }
        for (let i = 0; i < 90; i++) { const px = Math.random() * w, py = Math.random() * h, r = 2 + Math.random() * 6;
            x.fillStyle = 'rgba(0,0,0,0.4)'; x.beginPath(); x.ellipse(px + 2, py + 2, r, r * 0.7, 0, 0, Math.PI * 2); x.fill();
            const rg = x.createLinearGradient(px, py - r, px, py + r); rg.addColorStop(0, '#8a7a66'); rg.addColorStop(1, '#4a3e32'); x.fillStyle = rg; x.beginPath(); x.ellipse(px, py, r, r * 0.7, 0, 0, Math.PI * 2); x.fill(); }
        for (let i = 0; i < 160; i++) { const px = Math.random() * w, py = Math.random() * h; x.strokeStyle = ['#5f8a3a', '#4c7330', '#7aa24a'][i % 3]; x.lineWidth = 1.5;
            for (let k = -1; k <= 1; k++) { x.beginPath(); x.moveTo(px + k * 2, py); x.quadraticCurveTo(px + k * 4, py - 5, px + k * 5, py - 8 - Math.random() * 4); x.stroke(); } }
        x.strokeStyle = 'rgba(255,190,90,0.25)'; x.lineWidth = 6; x.strokeRect(3, 3, w - 6, h - 6);
        x.strokeStyle = 'rgba(0,0,0,0.6)'; x.lineWidth = 2; x.strokeRect(8, 8, w - 16, h - 16);
        this.ground = c;
    },
    drawBackground(ctx, w, h, dt) {
        if(this.particles.length === 0) this.generateDust();
        if (!this.ground || this.ground.width !== w) this.buildGround(w, h);
        ctx.drawImage(this.ground, 0, 0);
        ctx.save();
        
        const t = performance.now()/2000;
        const cx = w/2 + Math.cos(t)*100;
        const cy = h/2 + Math.sin(t)*100;
        const bgGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 600);
        bgGrad.addColorStop(0, 'rgba(255, 190, 110, 0.10)');
        bgGrad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0,0,w,h);

        ctx.fillStyle = '#fff';
        this.particles.forEach(p => {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if(p.x < 0) p.x = w; if(p.x > w) p.x = 0;
            if(p.y < 0) p.y = h; if(p.y > h) p.y = 0;
            ctx.globalAlpha = p.alpha + Math.sin(t*5 + p.x)*0.2;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        });
        ctx.restore();
    },
    drawForeground(ctx, w, h, dt) {
        ctx.save();
        const g = ctx.createRadialGradient(w/2, h/2, h/2.2, w/2, h/2, h);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(0,0,0,0.6)');
        ctx.fillStyle = g;
        ctx.fillRect(0,0,w,h);
        ctx.restore();
    }
};

const Game = {
    state: 'MENU',
    wave: 1,
    timer: 25, 
    spawnTimer: 0,
    spawnRate: 1.0,
    randomMeteorTimer: 0,
    enemies: [],
    bullets: [],
    enemyBullets: [],
    particles: [],
    texts: [],
    loot: [],
    player: null,
    shake: 0,
    paused: false,
    lastTime: 0,

    init() {
        this.player = new Player();
        this.player.addWeapon('Pistol', 0);
        requestAnimationFrame((ts) => this.loop(ts));
    },

    start() {
        this.state = 'PLAY';
        document.getElementById('menuOverlay').classList.add('hidden');
        document.getElementById('startScreen').classList.add('hidden');
        document.querySelectorAll('.sidebar').forEach(s => s.style.display = 'none');
        document.getElementById('mainLayout').style.gridTemplateColumns = '1fr';
        document.getElementById('mainLayout').style.justifyItems = 'center';
        Sound.init();
    },

    activateDevMode() {
        if(!this.player) return;
        this.player.invincible = !this.player.invincible;
        
        if(this.player.invincible) {
             this.texts.push(new FloatText("DEV MODE: ON", this.player.x, this.player.y - 50, '#ff00ff'));
             const hasWep = this.player.weapons.find(w => w.name === "DEV DESTROYER");
             if(!hasWep) {
                 this.player.weapons.push({
                    id: Math.random(),
                    name: "DEV DESTROYER",
                    tier: 3, 
                    base: { name: "DEV DESTROYER", type: 'gun', speed: 2000, desc: "Admin Weapon" },
                    dmg: 9999,
                    cd: 0.05,
                    range: 1000,
                    cdTimer: 0,
                    color: '#ff00ff'
                });
                InventoryUI.render(); 
             }
        } else {
             this.texts.push(new FloatText("DEV MODE: OFF", this.player.x, this.player.y - 50, '#ff0000'));
        }
    },
    
    togglePause() {
        if (this.state !== 'PLAY') return;
        this.paused = !this.paused;
        document.getElementById('pauseScreen').style.display = this.paused ? 'flex' : 'none';
    },

    loop(timestamp) {
        requestAnimationFrame((ts) => this.loop(ts));
        
        if(!this.lastTime) this.lastTime = timestamp || performance.now();
        let dt = (timestamp - this.lastTime) / 1000 || 0.016;
        this.lastTime = timestamp;
        if(dt > 0.1) dt = 0.1; 

        if(this.state === 'PLAY' && !this.paused) {
            this.timer -= dt;
            document.getElementById('gameTimer').innerText = Math.ceil(this.timer);
            
            if (this.timer <= 0) {
                this.enemies = [];
                this.loot = [];
                this.bullets = [];
                this.enemyBullets = [];
                Shop.open();
                return;
            }

            this.player.regenTimer -= dt;
            if(this.player.regenTimer <= 0 && this.player.hp < this.player.maxHp) {
                this.player.hp += this.player.hpRegen;
                if(this.player.hp > this.player.maxHp) this.player.hp = this.player.maxHp;
                this.player.regenTimer = 5;
                UI.update();
            }

            this.spawnTimer -= dt;
            if (this.spawnTimer <= 0) {
                this.spawnEnemy();
                this.spawnTimer = this.spawnRate;
            }

            const hasMeteorStaff = this.player.weapons.some(w => w.name === 'Meteor Staff');
            if (hasMeteorStaff) {
                this.randomMeteorTimer -= dt;
                if (this.randomMeteorTimer <= 0) {
                    this.randomMeteorTimer = 0.8; 
                    const tx = Math.random() * C.width;
                    const ty = Math.random() * C.height;
                    this.bullets.push(new Bullet(
                        tx, ty, 0, 0, 
                        150 * this.player.dmgMod, 
                        '#e74c3c', 
                        { name: 'Meteor Staff', type: 'explosive', explode: 120, life: 1.0 }, 
                        0
                    ));
                }
            }

            this.player.update(dt);
            this.enemies.forEach(e => e.update(dt));
            this.bullets.forEach(b => b.update(dt));
            this.enemyBullets.forEach(b => b.update(dt));
            this.particles.forEach(p => p.update(dt));
            this.loot.forEach(l => l.update(dt));
            this.texts.forEach(t => t.update(dt));

            this.enemies = this.enemies.filter(e => !e.dead);
            this.bullets = this.bullets.filter(b => !b.dead);
            this.enemyBullets = this.enemyBullets.filter(b => !b.dead);
            this.particles = this.particles.filter(p => p.life > 0);
            this.loot = this.loot.filter(l => !l.dead);
            this.texts = this.texts.filter(t => t.life > 0);

            UI.update();
        }

        AdvancedFX.drawBackground(ctx, C.width, C.height, dt);

        ctx.save();
        if(this.shake > 0) {
            ctx.translate(Math.random()*this.shake - this.shake/2, Math.random()*this.shake - this.shake/2);
            this.shake *= 0.9;
        }

        if(this.player) {
            const shadowGrad = ctx.createRadialGradient(this.player.x, this.player.y+15, 0, this.player.x, this.player.y+15, 25);
            shadowGrad.addColorStop(0, 'rgba(0,0,0,0.6)');
            shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = shadowGrad;
            ctx.beginPath();
            ctx.ellipse(this.player.x, this.player.y+15, 25, 12, 0, 0, Math.PI*2);
            ctx.fill();
        }

        this.loot.forEach(l => l.draw(ctx));
        this.enemies.forEach(e => e.draw(ctx));
        if(this.player) this.player.draw(ctx);
        this.bullets.forEach(b => b.draw(ctx));
        this.enemyBullets.forEach(b => b.draw(ctx));
        
        ctx.globalCompositeOperation = 'lighter';
        this.particles.forEach(p => p.draw(ctx));
        ctx.globalCompositeOperation = 'source-over';
        
        this.texts.forEach(t => t.draw(ctx));
        
        AdvancedFX.drawForeground(ctx, C.width, C.height, dt);

        if(this.shake > 2) {
            ctx.globalCompositeOperation = 'overlay';
            ctx.fillStyle = 'rgba(255, 0, 0, 0.1)';
            ctx.fillRect(3, 0, C.width, C.height);
            ctx.fillStyle = 'rgba(0, 0, 255, 0.1)';
            ctx.fillRect(-3, 0, C.width, C.height);
            ctx.globalCompositeOperation = 'source-over';
        }

        ctx.restore();
    },

    spawnEnemy() {
        const bossWave = this.wave % 5 === 0;
        
        if (bossWave) {
            const hasBoss = this.enemies.some(e => e.type === 'boss');
            if (!hasBoss && this.timer > 10) { 
                const x = C.width/2; 
                const y = -100;
                this.enemies.push(new Enemy(x, y, 'boss'));
                this.texts.push(new FloatText("WARNING: OBLITERATOR", C.width/2-100, C.height/2, '#ff0000'));
                document.getElementById('bossBarContainer').style.display = 'block';
                return;
            }
            if (Math.random() > 0.2) return; 
        } else {
             document.getElementById('bossBarContainer').style.display = 'none';
        }

        let ex, ey, dist;
        let safe = false;
        let attempts = 0;
        while (!safe && attempts < 10) {
            ex = Math.random() * C.width;
            ey = Math.random() * C.height;
            dist = Math.hypot(ex - this.player.x, ey - this.player.y);
            if (dist > 200) safe = true; 
            attempts++;
        }
        if (!safe) {
            const edge = Math.floor(Math.random()*4);
            const pad = 30;
            if(edge === 0) { ex = Math.random()*1200; ey = -pad; } 
            else if(edge === 1) { ex = 1200+pad; ey = Math.random()*800; } 
            else if(edge === 2) { ex = Math.random()*1200; ey = 800+pad; } 
            else { ex = -pad; ey = Math.random()*800; } 
        }

        const types = ['basic'];
        if(Game.wave >= 2) types.push('rusher');
        if(Game.wave >= 3) types.push('tank');
        if(Game.wave >= 4) types.push('charger');
        if(Game.wave >= 5) types.push('snake');
        if(Game.wave >= 6) types.push('shooter');
        if(Game.wave >= 7) types.push('ghost');
        if(Game.wave >= 10 && Math.random() < 0.1) types.push('titan');

        const type = types[Math.floor(Math.random() * types.length)];
        this.enemies.push(new Enemy(ex, ey, type));
    }
};

class Player {
    constructor() {
        this.x = 600;
        this.y = 400;
        this.r = 20;
        this.hp = 20;
        this.maxHp = 20;
        this.mats = 0;
        this.speed = 200;
        this.dmgMod = 1.0;
        this.atkSpd = 1.0;
        this.rangeMod = 1.0;
        this.pickup = 100;
        this.armor = 0;
        this.hpRegen = 0;
        this.regenTimer = 5;
        this.weapons = [];
        this.items = [];
        this.frame = 0;
        this.invincible = false;
    }
    addWeapon(name, tier) {
        if(this.weapons.length >= 6) return false;
        const base = WEAPONS_DB.find(w => w.name === name);
        const tInfo = TIERS[tier];
        this.weapons.push({
            id: Math.random(),
            name: base.name,
            tier: tier,
            base: base,
            dmg: base.dmg * tInfo.mult,
            cd: base.cd,
            range: base.range,
            cdTimer: 0,
            color: tInfo.color
        });
        InventoryUI.render();
        return true;
    }
    update(dt) {
        this.frame += dt * 5;
        let dx = 0, dy = 0;
        if(Keys.w) dy--;
        if(Keys.s) dy++;
        if(Keys.a) dx--;
        if(Keys.d) dx++;
        
        if(dx||dy) {
            const l = Math.hypot(dx,dy);
            this.x += (dx/l)*this.speed*dt;
            this.y += (dy/l)*this.speed*dt;
        }

        this.x = Math.max(20, Math.min(1180, this.x));
        this.y = Math.max(20, Math.min(780, this.y));

        this.weapons.forEach(w => {
            w.cdTimer -= dt;
            if(w.cdTimer <= 0) {
                let target = null;
                let minD = w.range * this.rangeMod;
                Game.enemies.forEach(e => {
                    const d = Math.hypot(e.x - this.x, e.y - this.y);
                    if(d < minD) {
                        minD = d;
                        target = e;
                    }
                });

                if(target || w.name === "Mine Layer") {
                    this.fireWeapon(w, target || {x: this.x + 1, y: this.y});
                    w.cdTimer = w.cd / this.atkSpd;
                }
            }
        });
    }

    fireWeapon(w, target) {
        const ang = Math.atan2(target.y - this.y, target.x - this.x);
        const count = w.base.count || 1;
        const spread = w.base.spread || 0;
        const start = ang - (spread/2);
        
        for(let i=0; i<count; i++) {
            const a = count===1 ? ang : start + (i * spread/(count-1));
            const isMelee = w.base.type === 'melee';
            const spd = w.base.speed;
            const vx = Math.cos(a)*spd;
            const vy = Math.sin(a)*spd;
            
            let startAngle = a;
            if(w.base.anim === 'sweep') startAngle -= w.base.sweepArc / 2;

            Game.bullets.push(new Bullet(
                this.x, this.y,
                vx, vy, 
                w.dmg * this.dmgMod, 
                w.color,
                w.base,
                startAngle
            ));
            Sound.play('shoot');
        }
    }

    draw(ctx) {
        const breathe = Math.sin(this.frame) * 1.5;
        
        ctx.save();
        ctx.translate(this.x, this.y);
        
        this.weapons.forEach((w, i) => {
            const orbitSpeed = Date.now() / 1000;
            const offset = (Math.PI * 2 / this.weapons.length) * i;

            const wy = Math.sin(orbitSpeed + offset) * 35;
            
            ctx.save();
            ctx.translate(wx, wy);
            ctx.rotate(orbitSpeed + offset); 

            const name = w.name;

            ctx.lineJoin = 'round';

                ctx.lineTo(0, 8); ctx.lineTo(-2, 2); ctx.lineTo(-8, 0); ctx.lineTo(-2, -2);
