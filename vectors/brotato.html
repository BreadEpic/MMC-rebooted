class Bullet {
    constructor(x, y, vx, vy, dmg, col, props, angle) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.dmg = dmg; this.col = col; this.props = props;
        this.life = props.life || 0.4;
        this.maxLife = this.life;
        this.dead = false;
        this.angle = angle || 0;
        this.pierce = props.pierce || 0;
        this.spin = 0;
        
        this.startAngle = angle;
        this.sweepArc = props.sweepArc || 1.0;
        this.stabDist = props.stabDist || 40;
        this.hitEnemies = new Set();
    }
    update(dt) {
        if (this.props.name === 'Bio-Cloud') {
            this.life -= dt;
            if(this.life <= 0) this.dead = true;
            this.spin += dt * 2;
            this.cloudHitTimer = (this.cloudHitTimer || 0) - dt;
            if (this.cloudHitTimer <= 0) {
                 Game.enemies.forEach(e2 => {
                     if(Math.hypot(e2.x - this.x, e2.y - this.y) < (this.props.explode || 80)) {
                         e2.takeDamage(this.dmg);
                     }
                 });
                 this.cloudHitTimer = 0.5;
            }
            return; 
        } else if(this.props.type === 'melee') {
            this.life -= dt;
            if(this.life <= 0) this.dead = true;
            
            const progress = 1 - (this.life / this.maxLife);
            
            this.x = Game.player.x;
            this.y = Game.player.y;
            
            if (this.props.anim === 'sweep') {
                const ease = (Math.sin((progress - 0.5) * Math.PI) + 1) / 2; 
                this.angle = this.startAngle + (this.sweepArc * ease) - (this.sweepArc / 2);
            } else if (this.props.anim === 'spin') {
                 this.angle += dt * 15;
            } else {
                 this.angle = this.startAngle;
            }

        } else if (this.props.name === 'Boomerang') {
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.life -= dt;
            this.vx *= 0.98;
            this.vy *= 0.98;

            if (this.life < this.props.life / 2) {
                const dx = Game.player.x - this.x;
                const dy = Game.player.y - this.y;
                const dist = Math.hypot(dx, dy);
                const returnSpeed = 800 * dt;
                this.vx += (dx / dist) * returnSpeed;
                this.vy += (dy / dist) * returnSpeed;

                if (dist < 20) this.dead = true;
            }
        } else {
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.life -= dt;
            if(this.life <= 0) this.dead = true;
            this.spin += dt * 15;
        }

        for(let ex of Game.enemies) {
            if (this.hitEnemies.has(ex)) continue;
            
            let hit = false;
            
            if (this.props.type === 'melee') {
                const dx = ex.x - this.x; 
                const dy = ex.y - this.y; 
                const dist = Math.hypot(dx, dy);
                
                let angleToEnemy = Math.atan2(dy, dx);
                let angleDiff = angleToEnemy - this.angle;
                while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI*2;
                
                let arc = 0.6; 
                if (this.props.anim === 'sweep') arc = 0.8;
                if (this.props.name === 'Excalibur') arc = 1.2;
                if (this.props.anim === 'stab') arc = 0.3;
                
                let actualRange = (this.props.range || 60) * Game.player.rangeMod;
                if (this.props.name === 'Excalibur') actualRange = 180 * Game.player.rangeMod;
                
                if (dist < ex.r + actualRange && Math.abs(angleDiff) < arc) {
                    hit = true;
                }
            } else {
                let hitR = ex.r + 15;
                if(Math.hypot(ex.x - this.x, ex.y - this.y) < hitR) {
                    hit = true;
                }
            }

            if(hit) {
                this.hitEnemies.add(ex);
                ex.takeDamage(this.dmg);
                Game.particles.push(new Particle(ex.x, ex.y, this.col));
                
                if(this.props.name === "Rocket" || this.props.name === "Grenade" || this.props.name === "Plasma Cannon" || this.props.name === "Mine Layer" || this.props.name === "Void Cannon" || this.props.name === "Meteor Staff" || this.props.name === "Nuke Launcher" || this.props.name === "Bio-Launcher") {
                    Game.shake = 5;
                    Game.particles.push(new Explosion(this.x, this.y, this.props.explode || 100, this.col));
                    Game.enemies.forEach(e2 => {
                        if(e2 !== ex && Math.hypot(e2.x - this.x, e2.y - this.y) < (this.props.explode || 100)) {
                            e2.takeDamage(this.dmg);
                            this.hitEnemies.add(e2);
                        }
                    });
                    
                    if (this.props.name === "Bio-Launcher") {
                        this.props = Object.assign({}, this.props);
                        this.props.name = "Bio-Cloud";
                        this.vx = 0;
                        this.vy = 0;
                        this.life = 5.0;
                        this.maxLife = 5.0;
                        this.dmg = this.dmg * 0.2; 
                    } else {
                        this.dead = true;
                    }
                    break;
                } else if (this.props.type !== 'melee') {
                    this.pierce--;
                    if(this.pierce < 0) {
                        this.dead = true;
                        break;
                    }
                }
            }
        }
    }
    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        const name = this.props.name;
        
        if (name === 'Meteor Staff') {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.ellipse(0, 0, 15, 5, 0, 0, Math.PI*2); ctx.fill();
            const height = this.life * 300; 
            ctx.translate(0, -height);
            ctx.fillStyle = '#e74c3c';
            ctx.shadowBlur = 15; ctx.shadowColor = '#f1c40f';
            ctx.beginPath(); ctx.arc(0,0, 12, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = 'orange';
            ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(0, -30); ctx.lineTo(8,0); ctx.fill();
            ctx.shadowBlur = 0;
        } 
        else if (name === 'Thunderfury') {
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10; ctx.shadowColor = '#f1c40f';
            ctx.beginPath();
            ctx.moveTo(0,0);
            let ly = -600;
            let lx = 0;
            while(ly < 0) {
                lx += (Math.random()-0.5)*30;
                ly += 40;
                ctx.lineTo(lx, ly);
            }
            ctx.stroke();
            ctx.shadowBlur = 0;
        } 
        else if (name === 'Thunder' || name === 'Tesla Coil') {
            ctx.strokeStyle = name === 'Thunder' ? '#f1c40f' : '#00f3ff';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 10; ctx.shadowColor = ctx.strokeStyle;
            ctx.beginPath();
            ctx.moveTo(0,0);
            if (name === 'Thunder') {
                let ly = -600;
                let lx = 0;
                while(ly < 0) {
                    lx += (Math.random()-0.5)*30;
                    ly += 40;
                    ctx.lineTo(lx, ly);
                }
            } else {
                for(let i=0; i<4; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    ctx.lineTo(Math.cos(angle)*60, Math.sin(angle)*60);
                    ctx.moveTo(0,0);
                }
            }
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(0,0, 5, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (name === 'Void Cannon') {
            const s = 1 + Math.sin(Date.now()/50)*0.3;
            ctx.scale(s,s);
            ctx.shadowBlur = 20; ctx.shadowColor = '#8e44ad';
            const g = ctx.createRadialGradient(0,0,5,0,0,25);
            g.addColorStop(0, '#000');
            g.addColorStop(0.7, '#8e44ad');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(0,0,25,0,Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (name === 'Bio-Launcher' || name === 'Bio-Cloud') {
            ctx.shadowBlur = 10; ctx.shadowColor = '#2ecc71';
            ctx.fillStyle = '#2ecc71';
            
            if (name === 'Bio-Cloud') {
                const size = this.props.explode || 80;
                ctx.globalAlpha = (this.life / this.maxLife) * 0.5;
                ctx.beginPath(); ctx.arc(0,0,size,0,Math.PI*2); ctx.fill();
                
                ctx.globalAlpha = (this.life / this.maxLife) * 0.8;
                for(let i=0; i<5; i++) {
                    ctx.fillStyle = 'rgba(46, 204, 113, 0.8)';
                    ctx.beginPath(); 
                    ctx.arc(Math.cos(i + this.spin)*size*0.5, Math.sin(i + this.spin)*size*0.5, 10, 0, Math.PI*2); 
                    ctx.fill();
                }
            } else {
                ctx.beginPath(); ctx.arc(0,0,8,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-2,-2,3,0,Math.PI*2); ctx.fill(); 
                ctx.fillStyle = 'rgba(46, 204, 113, 0.8)';
                ctx.beginPath(); ctx.arc(Math.random()*10-5, Math.random()*10-5, 4, 0, Math.PI*2); ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        }
        else if (name === 'Frost Wand') {
            ctx.rotate(this.spin);
            ctx.shadowBlur = 15; ctx.shadowColor = '#00f3ff';
            ctx.fillStyle = '#00f3ff';
            ctx.beginPath(); ctx.moveTo(0,-12); ctx.lineTo(3,0); ctx.lineTo(0,12); ctx.lineTo(-3,0); ctx.fill();
            ctx.beginPath(); ctx.moveTo(-12,0); ctx.lineTo(0,3); ctx.lineTo(12,0); ctx.lineTo(0,-3); ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (name === 'Crossblade') {
            ctx.rotate(this.spin);
            ctx.shadowBlur = 10; ctx.shadowColor = '#c0392b';
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(0, -20); ctx.lineTo(6, 0); ctx.lineTo(0, 20); ctx.lineTo(-6, 0);
            ctx.moveTo(-20, 0); ctx.lineTo(0, 6); ctx.lineTo(20, 0); ctx.lineTo(0, -6);
            ctx.fill();
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0,0, 4, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (name === 'Nuke Launcher') {
            ctx.rotate(Math.atan2(this.vy, this.vx));
            ctx.shadowBlur = 20; ctx.shadowColor = '#f39c12';
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath(); ctx.ellipse(0,0,20,10,0,0,Math.PI*2); ctx.fill();
            ctx.fillStyle = '#f1c40f'; 
            ctx.fillRect(-5, -9, 10, 18);
            ctx.fillStyle = '#e74c3c'; 
            ctx.beginPath(); ctx.arc(15,0,6,0,Math.PI*2); ctx.fill();
            ctx.fillStyle = '#e67e22';
            ctx.beginPath(); ctx.arc(-25, 0, 8 + Math.random()*5, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (name === 'Gatling Laser' || name === 'Laser') {
            ctx.rotate(Math.atan2(this.vy, this.vx));
            ctx.strokeStyle = name === 'Laser' ? '#ff0055' : '#e74c3c';
            ctx.lineWidth = name === 'Laser' ? 6 : 3;
            ctx.shadowBlur = 15; ctx.shadowColor = ctx.strokeStyle;
            ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(name === 'Laser'? -80 : -40, 0); ctx.stroke();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = name === 'Laser' ? 3 : 1;
            ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(name === 'Laser'? -60 : -30, 0); ctx.stroke();
            ctx.shadowBlur = 0;
        }
        else if (name === 'Potato Thrower') {
            ctx.rotate(this.spin);
            ctx.shadowBlur = 5; ctx.shadowColor = '#000';
            ctx.fillStyle = '#d35400';
            ctx.beginPath(); ctx.ellipse(0,0, 10, 7, 0, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#e67e22';
            ctx.beginPath(); ctx.arc(3,-3, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(-2,2, 1.5, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (name === 'Railgun' || name === 'Gauss Rifle') {
            ctx.rotate(Math.atan2(this.vy, this.vx));
            ctx.strokeStyle = `rgba(0, 243, 255, ${this.life/this.maxLife})`;
            ctx.lineWidth = name === 'Railgun' ? 12 : 6;
            ctx.shadowBlur = 20; ctx.shadowColor = '#00f3ff';
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0,0);
            ctx.lineTo(-2000, 0); 
            ctx.stroke();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = name === 'Railgun' ? 4 : 2;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
        else if (name === 'Kunai') {
            ctx.rotate(Math.atan2(this.vy, this.vx)); 
            ctx.shadowBlur = 5; ctx.shadowColor = '#00f3ff';
            ctx.fillStyle = '#ecf0f1';
            ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-8, -3); ctx.lineTo(-8, 3); ctx.fill();
            ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(-10,0,2,0,Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (name === 'Shuriken') {
            ctx.rotate(this.spin);
            ctx.shadowBlur = 5; ctx.shadowColor = '#00f3ff';
            ctx.fillStyle = '#ecf0f1';
            ctx.beginPath();
            ctx.moveTo(0, -12); ctx.lineTo(3, -3); ctx.lineTo(12, 0); ctx.lineTo(3, 3);
            ctx.lineTo(0, 12); ctx.lineTo(-3, 3); ctx.lineTo(-12, 0); ctx.lineTo(-3, -3);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (name === 'Rock') {
            ctx.rotate(this.spin);
            ctx.shadowBlur = 5; ctx.shadowColor = '#7f8c8d';
            ctx.fillStyle = '#95a5a6';
            ctx.beginPath();
            ctx.moveTo(-6, -5); ctx.lineTo(4, -7); ctx.lineTo(7, 2); ctx.lineTo(1, 8); ctx.lineTo(-7, 3);
            ctx.fill();
            ctx.fillStyle = '#7f8c8d';
            ctx.beginPath(); ctx.arc(-2, 0, 2, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (this.props.type === 'melee') {
            ctx.rotate(this.angle);
            const progress = 1 - (this.life / this.maxLife);
            
            if (this.props.anim === 'sweep') {
                const visualRange = (this.props.range || 80) * Game.player.rangeMod;
                const swingGrad = ctx.createRadialGradient(0,0, 10, 0,0, visualRange);
                if (name === 'Excalibur') {
                    swingGrad.addColorStop(0, 'rgba(255,255,255,0)');
                    swingGrad.addColorStop(0.7, `rgba(241, 196, 15, ${this.life/this.maxLife})`);
                    swingGrad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.shadowBlur = 30; ctx.shadowColor = 'gold';
                    ctx.fillStyle = swingGrad;
                    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0, 0, 150 * Game.player.rangeMod, -0.6, 0.6); ctx.fill();
                } else {
                    swingGrad.addColorStop(0, 'rgba(255,255,255,0)');
                    swingGrad.addColorStop(0.8, `rgba(255, 255, 255, ${this.life/this.maxLife})`);
                    swingGrad.addColorStop(1, 'rgba(255,255,255,0)');
                    
                    ctx.lineWidth = visualRange * 0.4;
                    ctx.strokeStyle = swingGrad;
                    ctx.lineCap = 'round';
                    ctx.beginPath(); ctx.arc(0, 0, visualRange * 0.7, -0.5, 0.5); ctx.stroke();
                }
            } else if (this.props.anim === 'stab') {
                 const maxStab = (this.props.range || 60) * Game.player.rangeMod;
                 const dist = (progress < 0.5 ? progress * 2 : (1-progress)*2) * maxStab;
                 ctx.shadowBlur = 10; ctx.shadowColor = this.col;
                 ctx.fillStyle = '#fff';
                 ctx.beginPath(); 
                 ctx.moveTo(0, -4); ctx.lineTo(dist, 0); ctx.lineTo(0, 4); ctx.fill();
            } else if (this.props.anim === 'spin') {
                 const dist = (this.props.range || 60) * Game.player.rangeMod;
                 ctx.shadowBlur = 10; ctx.shadowColor = this.col;
                 ctx.fillStyle = this.col;
                 ctx.beginPath(); ctx.arc(dist, 0, 10, 0, Math.PI*2); ctx.fill();
                 ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(dist, 0, 3, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.fillStyle = this.col;
                ctx.globalAlpha = this.life / this.maxLife;
                ctx.beginPath(); ctx.arc(0, 0, 30, -0.5, 0.5); ctx.lineTo(0,0); ctx.fill();
            }
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        } 
        else if (name === 'Boomerang') {
            ctx.rotate(this.spin);
            ctx.shadowBlur = 10; ctx.shadowColor = this.col;
            ctx.fillStyle = this.col;
            ctx.beginPath();
            ctx.moveTo(0, -15); ctx.lineTo(8, 0); ctx.lineTo(0, 15); ctx.lineTo(-20, 0);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(0,0,3,0,Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        } 
        else if (name === 'Mine Layer') {
            ctx.fillStyle = '#333';
            ctx.shadowBlur = 10; ctx.shadowColor = 'red';
            ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
            if(this.life % 0.5 < 0.25) { 
                ctx.fillStyle='#ff0000'; 
                ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill(); 
            }
            ctx.shadowBlur = 0;
        }
        else if (this.props.type === 'fire') {
            ctx.shadowBlur = 15; ctx.shadowColor = 'red';
            const fireGrad = ctx.createRadialGradient(0,0,0, 0,0, 10);
            fireGrad.addColorStop(0, '#fffc00');
            fireGrad.addColorStop(0.4, '#ff9900');
            fireGrad.addColorStop(1, '#ff0000');
            
            ctx.fillStyle = fireGrad;
            ctx.globalAlpha = Math.random() * 0.5 + 0.5;
            ctx.beginPath();
            ctx.arc(0, 0, 6 + Math.random()*6, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1.0;
        } 
        else {
            ctx.rotate(Math.atan2(this.vy, this.vx));
            ctx.shadowBlur = 8; ctx.shadowColor = this.col;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.ellipse(0, 0, 6, 3, 0, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = this.col;
            ctx.globalAlpha = 0.6;
            ctx.beginPath(); ctx.ellipse(-8, 0, 10, 2, 0, 0, Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0;
            ctx.shadowBlur = 0;
        }
        
        ctx.restore();
    }
}

class Enemy {
    constructor(x, y, type='basic') {
        this.x = x; this.y = y;
        this.type = type;
        this.dead = false;
        this.flash = 0;
        this.attackCd = 0;
        this.frame = Math.random() * 10;
        
        this.hp = 15 + Game.wave * 6;
        this.spd = 80;
        this.dmg = 3;
        this.r = 15;
        this.col = '#c0392b';

        if(type === 'tank') {
            this.hp *= 2.5;
            this.spd *= 0.5;
            this.r = 22;
            this.col = '#7f8c8d';
            this.dmg *= 1.5;
        } else if (type === 'rusher') {
            this.hp *= 0.6;
            this.spd *= 1.6;
            this.r = 12;
            this.col = '#f1c40f';
        } else if (type === 'snake') {
            this.hp *= 0.8;
            this.spd *= 1.1;
            this.col = '#2ecc71';
            this.waveOff = Math.random() * Math.PI * 2;
        } else if (type === 'ghost') {
            this.hp *= 0.7;
            this.spd *= 1.2;
            this.col = '#00f3ff';
            this.alpha = 0.5;
        } else if (type === 'titan') {
            this.hp *= 10;
            this.spd *= 0.4;
            this.r = 35;
            this.col = '#8e44ad';
            this.dmg *= 3;
        } else if (type === 'charger') {
            this.hp *= 1.5;
            this.spd *= 0.8;
            this.r = 18;
            this.col = '#e67e22';
            this.chargeCd = 3.0;
            this.isCharging = false;
        } else if (type === 'shooter') {
            this.hp *= 1.0;
            this.spd *= 0.6;
            this.r = 16;
            this.col = '#3498db';
            this.shootCd = 5.0;
        } else if (type === 'boss') {
            this.hp = 3000 * Math.pow(1.8, Game.wave/5);
            this.spd = 60 + (Game.wave * 2);
            this.r = 80;
            this.col = '#000';
            this.dmg = 20 * Math.pow(1.2, Game.wave/5);
            this.maxHp = this.hp;
            this.state = 'idle';
            this.stateTimer = 0;
            this.bossAbilityCd = 3.0;
            this.chargeDir = 0;
            this.hasSlashed = false;
        }
    }

    update(dt) {
        this.frame += dt;
        if(this.attackCd > 0) this.attackCd -= dt;

        const p = Game.player;
        const dx = p.x - this.x;
        const dy = p.y - this.y;
        const d = Math.hypot(dx, dy);

        let mvX = (dx/d);
        let mvY = (dy/d);
        let speedMult = 1.0;

        if(this.type === 'snake') {
            const perpX = -mvY;
            const perpY = mvX;
            const wave = Math.sin(this.frame * 5 + this.waveOff) * 0.8;
            mvX += perpX * wave;
            mvY += perpY * wave;
        } else if (this.type === 'charger') {
            if (!this.isCharging) {
                this.chargeCd -= dt;
                if (this.chargeCd <= 0 && d < 400) {
                    this.isCharging = true;
                    this.chargeTime = 0.6;
                    this.chargeDir = Math.atan2(dy, dx);
                }
            } else {
                this.chargeTime -= dt;
                mvX = Math.cos(this.chargeDir);
                mvY = Math.sin(this.chargeDir);
                speedMult = 4.0;
                if (this.chargeTime <= 0) {
                    this.isCharging = false;
                    this.chargeCd = 3.0;
                }
            }
        } else if (this.type === 'shooter') {
            this.shootCd -= dt;
            if (d > 350) { speedMult = 1.0; }
            else if (d < 200) { speedMult = -1.0; }
            else { speedMult = 0; }
            
            if (this.shootCd <= 0) {
                Game.enemyBullets.push(new EnemyHomingProjectile(this.x, this.y, this.dmg));
                this.shootCd = 5.0;
            }
        }

        if(this.type !== 'ghost' && this.type !== 'boss' && !(this.type === 'charger' && this.isCharging)) {
            Game.enemies.forEach(e => {
                if (e === this || e.type === 'ghost' || e.type === 'boss') return;
                const dd = Math.hypot(this.x-e.x, this.y-e.y);
                if(dd < this.r+e.r) {
                    this.x += (this.x-e.x)/dd * 50 * dt;
                    this.y += (this.y-e.y)/dd * 50 * dt;
                }
            });
        }

        if(d < this.r + p.r) {
            if (this.attackCd <= 0 && !p.invincible) {
                let dmgTaken = Math.max(1, this.dmg - p.armor);
                p.hp -= dmgTaken;
                this.attackCd = 1.0;
                Game.shake = 5;
                if(p.hp <= 0) Game.state = 'OVER';
                Sound.play('hit');
            }
        }

        if (this.type !== 'boss') {
            this.x += mvX * this.spd * speedMult * dt;
            this.y += mvY * this.spd * speedMult * dt;
        } else {
            if (this.state === 'idle') {
                this.bossAbilityCd -= dt;
                if (this.bossAbilityCd <= 0) {
                    if (d < 150) {
                        this.state = 'slashing';
                        this.stateTimer = 0.5;
                        this.chargeDir = Math.atan2(dy, dx);
                    } else {
                        this.state = 'charging_beam';
                        this.stateTimer = 3.0;
                        this.chargeDir = Math.atan2(dy, dx);
                    }
                }
                this.x += mvX * this.spd * dt;
                this.y += mvY * this.spd * dt;
            } else if (this.state === 'charging_beam') {
                this.stateTimer -= dt;
                this.x += mvX * this.spd * 0.1 * dt; 
                this.y += mvY * this.spd * 0.1 * dt;
                
                let targetAngle = Math.atan2(dy, dx);
                let angleDiff = targetAngle - this.chargeDir;
                while (angleDiff > Math.PI) angleDiff -= Math.PI*2;
                while (angleDiff < -Math.PI) angleDiff += Math.PI*2;
                this.chargeDir += angleDiff * dt * 1.5; 
                
                if (this.stateTimer <= 0) {
                    this.state = 'firing_beam';
                    this.stateTimer = 1.0;
                    Game.shake = 10;
                    Sound.play('shoot');
                }
            } else if (this.state === 'firing_beam') {
                this.stateTimer -= dt;
                let px = Game.player.x;
                let py = Game.player.y;
                let length = 2000;
                let endX = this.x + Math.cos(this.chargeDir) * length;
                let endY = this.y + Math.sin(this.chargeDir) * length;
                
                let L2 = length * length;
                let t = Math.max(0, Math.min(1, ((px - this.x)*(endX - this.x) + (py - this.y)*(endY - this.y)) / L2));
                let projX = this.x + t * (endX - this.x);
                let projY = this.y + t * (endY - this.y);
                let distToLine = Math.hypot(px - projX, py - projY);
                
                if (distToLine < 40 && !Game.player.invincible) {
                    let dmgTaken = Math.max(1, (this.dmg*2) - Game.player.armor);
                    Game.player.hp -= dmgTaken * dt * 5;
                    if(Game.player.hp <= 0) Game.state = 'OVER';
                }
                
                if (this.stateTimer <= 0) {
                    this.state = 'idle';
                    this.bossAbilityCd = 3.0;
                }
            } else if (this.state === 'slashing') {
                this.stateTimer -= dt;
                this.x += mvX * this.spd * 1.5 * dt;
                this.y += mvY * this.spd * 1.5 * dt;
                if (d < this.r + 100 && !Game.player.invincible) {
                    if (!this.hasSlashed) {
                        let dmgTaken = Math.max(1, (this.dmg*1.5) - Game.player.armor);
                        Game.player.hp -= dmgTaken;
                        Game.shake = 5;
                        Sound.play('hit');
                        this.hasSlashed = true;
                        if(Game.player.hp <= 0) Game.state = 'OVER';
                    }
                }
                if (this.stateTimer <= 0) {
                    this.state = 'idle';
                    this.bossAbilityCd = 2.0;
                    this.hasSlashed = false;
                }
            }
        }
        
        if (this.type === 'boss') {
            const pct = (this.hp / this.maxHp) * 100;
            document.getElementById('bossBarFill').style.width = pct + '%';
        }

        if(Game.state === 'OVER') {
            document.getElementById('menuOverlay').classList.remove('hidden');
            document.getElementById('gameOverScreen').classList.remove('hidden');
            document.getElementById('deathText').innerText = "WAVE " + Game.wave + " COMPLETE";
        }

        if(this.flash > 0) this.flash -= dt;
    }

    takeDamage(amt) {
        this.hp -= amt;
        Game.texts.push(new FloatText(Math.round(amt), this.x, this.y-25, '#fff'));
        Sound.play('hit');
        
        if(this.hp <= 0) {
            this.dead = true;
            Game.shake = 3;
            
            if (this.type === 'boss') {
                 for(let i=0; i<30; i++) Game.loot.push(new Loot(this.x + (Math.random()-0.5)*100, this.y + (Math.random()-0.5)*100, 'mat'));
                 document.getElementById('bossBarContainer').style.display = 'none';
                 Game.shake = 20; 
            } else {
                 Game.loot.push(new Loot(this.x, this.y, 'mat')); 
            }
            
            Game.particles.push(new Particle(this.x, this.y, this.col, this.r));
            Sound.play('kill');
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        if (this.type === 'boss') {
            if (this.state === 'charging_beam') {
                ctx.save();
                ctx.rotate(this.chargeDir);
                ctx.strokeStyle = 'rgba(255,0,0,0.5)';
                ctx.lineWidth = 2 + Math.random()*4;
                ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(2000, 0); ctx.stroke();
                ctx.restore();
            } else if (this.state === 'firing_beam') {
                ctx.save();
                ctx.rotate(this.chargeDir);
                ctx.shadowBlur = 30; ctx.shadowColor = '#ff0055';
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, -40, 2000, 80);
                ctx.fillStyle = 'rgba(255, 0, 85, 0.8)';
                ctx.fillRect(0, -50, 2000, 100);
                ctx.restore();
            } else if (this.state === 'slashing') {
                ctx.save();
                ctx.rotate(this.chargeDir); 
                const swingProgress = 1 - (this.stateTimer / 0.5); 
                const swingAngle = -Math.PI/2 + (Math.PI * swingProgress); 
                ctx.rotate(swingAngle);
                
                ctx.fillStyle = '#7f8c8d';
                ctx.fillRect(0, -15, this.r + 40, 30);
                
                ctx.shadowBlur = 20; ctx.shadowColor = '#fff';
                ctx.fillStyle = '#bdc3c7';
                ctx.fillRect(this.r + 30, -30, 50, 60);
                
                ctx.fillStyle = '#333';
                ctx.fillRect(this.r + 70, -25, 10, 50); 
                ctx.restore();
            }
        }

        ctx.fillStyle = this.flash > 0 ? '#fff' : this.col;
        
        if (this.type === 'basic') {
            const r = this.r + Math.sin(this.frame*10)*2;
            const grad = ctx.createRadialGradient(0,0,0, 0,0, r);
            grad.addColorStop(0, this.flash > 0 ? '#fff' : '#ff4757');
            grad.addColorStop(1, this.flash > 0 ? '#fff' : '#8b0000');
            ctx.fillStyle = grad;
            
            ctx.beginPath(); ctx.arc(0,0, r, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle='#000'; 
            ctx.beginPath(); ctx.moveTo(-6,-6); ctx.lineTo(-2,-2); ctx.lineTo(-8,-2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(6,-6); ctx.lineTo(2,-2); ctx.lineTo(8,-2); ctx.fill();
        } 
        else if (this.type === 'tank') {
            ctx.rotate(Math.atan2(Game.player.y - this.y, Game.player.x - this.x)); 
            
            ctx.fillStyle = '#333';
            ctx.fillRect(-this.r-4, -this.r+2, 8, this.r*2-4); 
            ctx.fillRect(this.r-4, -this.r+2, 8, this.r*2-4); 
            
            const grad = ctx.createLinearGradient(-this.r, -this.r, this.r, this.r);
            grad.addColorStop(0, this.flash > 0 ? '#fff' : '#95a5a6');
            grad.addColorStop(1, this.flash > 0 ? '#fff' : '#2c3e50');
            ctx.fillStyle = grad;
            ctx.fillRect(-this.r, -this.r, this.r*2, this.r*2);
            
            ctx.shadowBlur = 10; ctx.shadowColor = '#f00';
            ctx.fillStyle = '#c0392b';
            ctx.beginPath(); ctx.arc(10, 0, 8, 0, Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.strokeStyle = '#000'; ctx.lineWidth=2;
            ctx.strokeRect(-this.r, -this.r, this.r*2, this.r*2);
            ctx.beginPath(); ctx.moveTo(0, -this.r); ctx.lineTo(0, this.r); ctx.stroke();
        }
        else if (this.type === 'rusher') {
            ctx.rotate(this.frame * 10);
            
            ctx.beginPath();
            const spikes = 6;
            for(let i=0; i<spikes*2; i++) {
                const rot = (Math.PI*2 / (spikes*2)) * i;
                const dist = i%2===0 ? this.r : this.r/2;
                ctx.lineTo(Math.cos(rot)*dist, Math.sin(rot)*dist);
            }
            const grad = ctx.createRadialGradient(0,0,0, 0,0, this.r);
            grad.addColorStop(0, this.flash > 0 ? '#fff' : '#f1c40f');
            grad.addColorStop(1, this.flash > 0 ? '#fff' : '#d35400');
            ctx.fillStyle = grad;
            ctx.fill();
            
            ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
            ctx.shadowBlur = 5; ctx.shadowColor = '#f00';
            ctx.fillStyle='#f00'; ctx.beginPath(); ctx.arc(0,0,2,0,Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (this.type === 'charger') {
            ctx.rotate(Math.atan2(Game.player.y - this.y, Game.player.x - this.x));
            ctx.fillStyle = this.flash > 0 ? '#fff' : '#e67e22';
            ctx.beginPath();
            ctx.moveTo(this.r, 0);
            ctx.lineTo(-this.r, this.r);
            ctx.lineTo(-this.r/2, 0);
            ctx.lineTo(-this.r, -this.r);
            ctx.fill();
            
            if (this.isCharging) {
                ctx.fillStyle = 'rgba(230, 126, 34, 0.5)';
                ctx.beginPath(); ctx.arc(-this.r*2, 0, this.r, 0, Math.PI*2); ctx.fill();
            }
        }
        else if (this.type === 'shooter') {
            ctx.rotate(Math.atan2(Game.player.y - this.y, Game.player.x - this.x));
            ctx.shadowBlur = 15; ctx.shadowColor = '#00f3ff';
            ctx.fillStyle = '#2c3e50';
            ctx.beginPath();
            ctx.moveTo(this.r, 0);
            ctx.lineTo(-this.r, this.r * 0.8);
            ctx.lineTo(-this.r * 0.5, 0);
            ctx.lineTo(-this.r, -this.r * 0.8);
            ctx.fill();
            
            ctx.fillStyle = '#00f3ff';
            ctx.beginPath(); ctx.arc(0, 0, this.r * 0.4, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(0, 0, this.r * 0.2, 0, Math.PI*2); ctx.fill();
            
            if (this.shootCd < 1.0) {
                ctx.fillStyle = `rgba(0, 243, 255, ${1 - this.shootCd})`;
                ctx.beginPath(); ctx.arc(this.r + 5, 0, 6, 0, Math.PI*2); ctx.fill();
            }
            ctx.shadowBlur = 0;
        }
        else if (this.type === 'snake') {
            ctx.rotate(Math.atan2(Game.player.y - this.y, Game.player.x - this.x)); 
            
            ctx.fillStyle = this.flash > 0 ? '#fff' : '#27ae60';
            for(let i=3; i>=1; i--) {
                 ctx.beginPath(); 
                 const offY = Math.sin(this.frame*10 + i)*10;
                 ctx.arc(-this.r*i*0.8, offY, this.r - (i*2), 0, Math.PI*2);
                 ctx.fill();
                 ctx.strokeStyle = '#000'; ctx.stroke();
            }
            
            ctx.fillStyle = this.flash > 0 ? '#fff' : '#2ecc71';
            ctx.beginPath(); ctx.arc(0,0,this.r,0,Math.PI*2); ctx.fill();
            ctx.stroke();
            
            ctx.shadowBlur = 5; ctx.shadowColor = '#f00';
            ctx.fillStyle='#f00'; 
            ctx.beginPath(); ctx.ellipse(5,-6,4,2,0,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(5, 6,4,2,0,0,Math.PI*2); ctx.fill();
            ctx.shadowBlur = 0;
        }
        else if (this.type === 'ghost') {
            const alpha = 0.5 + Math.sin(this.frame*5)*0.3;
            ctx.globalAlpha = this.flash > 0 ? 1.0 : alpha;
            ctx.shadowBlur = 20; ctx.shadowColor = '#00f3ff';
            
            const grad = ctx.createLinearGradient(0, -this.r, 0, this.r*2);
            grad.addColorStop(0, this.flash > 0 ? '#fff' : '#00f3ff');
            grad.addColorStop(1, 'rgba(0,243,255,0)');
            ctx.fillStyle = grad;
            
            ctx.beginPath(); 
            ctx.arc(0,0,this.r, Math.PI, 0);
            ctx.quadraticCurveTo(this.r, this.r*2, 0, this.r*1.5 + Math.sin(this.frame*10)*5);
            ctx.quadraticCurveTo(-this.r, this.r*2, -this.r, 0);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.ellipse(-5,-2,2,4,0,0,Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.ellipse(5,-2,2,4,0,0,Math.PI*2); ctx.fill();
            ctx.globalAlpha = 1.0;
        }
        else if (this.type === 'titan') {
            ctx.rotate(this.frame); 
            
            const grad = ctx.createRadialGradient(0,0,0, 0,0, this.r);
            grad.addColorStop(0, this.flash > 0 ? '#fff' : '#9b59b6');
            grad.addColorStop(1, this.flash > 0 ? '#fff' : '#4a235a');
            ctx.fillStyle = grad;
            
            ctx.beginPath(); 
            const sides = 8; 
            for(let i=0;i<sides;i++) {
                const a = (Math.PI*2/sides)*i;
                ctx.lineTo(Math.cos(a)*this.r, Math.sin(a)*this.r);
            }
            ctx.fill();
            
            ctx.strokeStyle = '#fff'; ctx.lineWidth=3; ctx.stroke();
            
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(0,0, this.r/2, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(0,0, this.r/4, 0, Math.PI*2); ctx.fill();
        }
        else if (this.type === 'boss') {
            ctx.rotate(Math.atan2(Game.player.y - this.y, Game.player.x - this.x)); 
            
            if (this.flash > 0) {
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(0,0, this.r, 0, Math.PI*2); ctx.fill();
            } else {
                ctx.shadowBlur = 30; ctx.shadowColor = '#c0392b';
                
                ctx.save();
                ctx.rotate(-this.frame * 2);
                ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 6;
                ctx.beginPath(); ctx.arc(0,0, this.r*1.2, 0, Math.PI*2); ctx.stroke();
                for(let i=0; i<12; i++) {
                    const a = (Math.PI*2/12)*i;
                    ctx.beginPath(); ctx.moveTo(Math.cos(a)*this.r*1.2, Math.sin(a)*this.r*1.2); 
                    ctx.lineTo(Math.cos(a)*this.r*1.5, Math.sin(a)*this.r*1.5); ctx.stroke();
                }
                ctx.restore();

                const bGrad = ctx.createLinearGradient(-this.r, -this.r, this.r, this.r);
                bGrad.addColorStop(0, '#7f8c8d');
                bGrad.addColorStop(0.5, '#2c3e50');
                bGrad.addColorStop(1, '#000');
                ctx.fillStyle = bGrad;
                
                ctx.beginPath();
                ctx.moveTo(this.r, 0);
                ctx.lineTo(this.r*0.5, this.r*0.8);
                ctx.lineTo(-this.r*0.5, this.r*0.8);
                ctx.lineTo(-this.r, 0);
                ctx.lineTo(-this.r*0.5, -this.r*0.8);
                ctx.lineTo(this.r*0.5, -this.r*0.8);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.stroke();
                
                ctx.fillStyle = '#c0392b';
                ctx.beginPath(); ctx.arc(0, -this.r*0.7, 25, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(0, this.r*0.7, 25, 0, Math.PI*2); ctx.fill(); ctx.stroke();

                ctx.fillStyle = '#000';
                ctx.fillRect(this.r*0.2, -this.r*0.4, 20, this.r*0.8);
                
                ctx.shadowColor = '#ff0055'; ctx.shadowBlur = 20;
                ctx.fillStyle = '#ff0055';
                const pulse = Math.sin(this.frame*20)*5;
                ctx.fillRect(this.r*0.25, -this.r*0.2, 10 + pulse, this.r*0.4);
                
                ctx.shadowBlur = 0;
            }
        }

        ctx.restore();
    }
}

class Loot {
    constructor(x, y, type='mat') {
        this.x = x; this.y = y; this.type = type;
        this.val = 1 + Math.floor(Math.random()*3);
        this.dead = false;
        this.bob = Math.random() * Math.PI;
    }
    update(dt) {
        this.bob += dt * 5;
        const p = Game.player;
        const d = Math.hypot(this.x - p.x, this.y - p.y);
        
        if(d < p.pickup) {
            this.x += (p.x - this.x) * 12 * dt;
            this.y += (p.y - this.y) * 12 * dt;
        }

        if(d < p.r + 5) {
            p.mats += this.val;
            Sound.play('collect');
            this.dead = true;
        }
    }
    draw(ctx) {
        const offY = Math.sin(this.bob) * 3;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#2ecc71';
        
        const grad = ctx.createRadialGradient(this.x, this.y-6+offY, 0, this.x, this.y+offY, 8);
        grad.addColorStop(0, '#a8ffc4');
        grad.addColorStop(0.5, '#2ecc71');
        grad.addColorStop(1, '#1e8449');
        
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - 8 + offY);
        ctx.lineTo(this.x + 6, this.y + offY);
        ctx.lineTo(this.x, this.y + 8 + offY);
        ctx.lineTo(this.x - 6, this.y + offY);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
}

class Particle {
    constructor(x, y, col, size=4) {
        this.x = x; this.y = y; this.col = col; this.size = size;
        this.life = 1.0;
        this.vx = (Math.random()-0.5)*150;
        this.vy = (Math.random()-0.5)*150;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.life -= dt * 2;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.shadowBlur = 10; ctx.shadowColor = this.col;
        ctx.fillStyle = this.col;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;
    }
}

class FloatText {
    constructor(text, x, y, col) {
        this.text = text; this.x = x; this.y = y; this.col = col;
        this.life = 1.0;
    }
    update(dt) {
        this.y -= 30 * dt;
        this.life -= dt;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.shadowBlur = 5; ctx.shadowColor = '#000';
        ctx.fillStyle = this.col;
        ctx.font = "bold 24px 'Rajdhani'";
        ctx.fillText(this.text, this.x, this.y);
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1.0;
    }
}

const UI = {
update() {
        if(!Game.player) return;
        const p = Game.player;
        const hpPct = (p.hp / p.maxHp) * 100;
        document.getElementById('hpFill').style.width = hpPct + '%';
        document.getElementById('hpText').innerText = Math.ceil(p.hp) + " / " + p.maxHp;
        document.getElementById('matCount').innerText = p.mats;
        document.getElementById('shopMoney').innerText = p.mats;
        
        InventoryUI.render();
    }
};

const InventoryUI = {
    render() {
        const p = Game.player;
        if(!p) return;
        
        const wList = document.getElementById('weaponList');
        wList.innerHTML = '';
        
        p.weapons.forEach((w, idx) => {
            const canMerge = p.weapons.filter(ow => ow.name === w.name && ow.tier === w.tier && ow !== w).length > 0 && w.tier < 3;
            
            const iconSvg = ICONS[w.name] || ICONS.Default;
            
            const actualDmg = Math.round(w.dmg * p.dmgMod);
            const actualCd = (w.cd / p.atkSpd).toFixed(2);
            const actualRng = Math.round(w.range * p.rangeMod);
            
            const div = document.createElement('div');
            div.className = `weapon-slot tier-${w.tier}`;
            div.innerHTML = `
                <div class="weapon-header">
                    <div class="icon-box" style="border-color:${w.color}">${iconSvg}</div>
                    <div class="wep-name" style="color:${w.color}; text-shadow:0 0 5px ${w.color}">${w.name} <span style="float:right; font-size:12px; color:#fff; border:1px solid #555; padding:2px 5px; border-radius:4px;">T${w.tier+1}</span></div>
                </div>
                <div class="wep-stats">DMG: ${actualDmg} | CD: ${actualCd}s | RNG: ${actualRng}</div>
                <div class="wep-desc">${w.base.desc}</div>
                <div class="slot-actions">
                    <button class="btn-mini btn-sell" onclick="InventoryUI.sell(${idx})">SELL $${10 + w.tier*10}</button>
                    ${canMerge ? `<button class="btn-mini btn-merge" onclick="InventoryUI.merge(${idx})">MERGE UP</button>` : ''}
                </div>
            `;
            wList.appendChild(div);
        });

        this.renderItems();
    },

    renderItems() {
        const p = Game.player;
        if(!p) return;
        const iList = document.getElementById('itemList');
        iList.innerHTML = '';
        
        const grouped = {};
        p.items.forEach(it => {
            if(!grouped[it.name]) grouped[it.name] = {...it, count: 0};
            grouped[it.name].count++;
        });
        
        Object.values(grouped).forEach(it => {
            const iconSvg = ICONS[it.name] || ICONS.Default;
            const div = document.createElement('div');
            div.className = 'item-slot';
            div.innerHTML = `
                <div class="icon-box" style="width:30px; height:30px; margin-right:8px; border-color:#2ecc71; position:relative;">
                    ${iconSvg}
                    ${it.count > 1 ? `<div style="position:absolute; bottom:-5px; right:-5px; background:var(--neon-green); color:#000; font-size:10px; font-weight:bold; padding:2px 4px; border-radius:4px;">x${it.count}</div>` : ''}
                </div>
                <div class="item-info">
                    <span class="item-name">${it.name}</span>
                    <span class="item-desc">${it.desc}</span>
                </div>
            `;
            iList.appendChild(div);
        });
    },

    sell(idx) {
        const w = Game.player.weapons[idx];
        Game.player.mats += 10 + w.tier*10;
        Game.player.weapons.splice(idx, 1);
        this.render();
        UI.update();
    },

    merge(idx) {
        const w = Game.player.weapons[idx];
        const matchIdx = Game.player.weapons.findIndex((ow, i) => i !== idx && ow.name === w.name && ow.tier === w.tier);
        if(matchIdx !== -1) {
            Game.player.weapons.splice(Math.max(idx, matchIdx), 1);
            Game.player.weapons.splice(Math.min(idx, matchIdx), 1);
            Game.player.addWeapon(w.name, w.tier + 1);
        }
    }
};

const Shop = {
    items: [],
    
    open() {
        Game.state = 'SHOP';
        
        document.querySelectorAll('.sidebar').forEach(s => s.style.display = 'flex');
        document.getElementById('mainLayout').style.gridTemplateColumns = '280px 1200px 280px';
        document.getElementById('mainLayout').style.justifyItems = 'initial';

        document.getElementById('menuOverlay').classList.remove('hidden');
        document.getElementById('shopScreen').classList.remove('hidden');
        document.getElementById('shopGrid').innerHTML = ''; 
        
        this.roll();
        this.updateStats();
        resizeGame();
    },
    
    roll() {
        const newItems = [];
        for(let i=0; i<4; i++) {
            if (this.items[i] && this.items[i].locked && !this.items[i].bought) {
                newItems.push(this.items[i]);
                continue;
            }
            
            const isWep = Math.random() < 0.4;
            if(isWep) {
                const w = WEAPONS_DB[Math.floor(Math.random()*WEAPONS_DB.length)];
                let tier = 0;
                if(Game.wave > 3 && Math.random() < 0.3) tier = 1;
                if(Game.wave > 6 && Math.random() < 0.15) tier = 2;
                if(Game.wave > 10 && Math.random() < 0.05) tier = 3;
                
                const cost = 20 + (tier*30) + (Game.wave*2);
                newItems.push({ type:'weapon', data:w, tier:tier, cost:cost, bought:false, locked:false });
            } else {
                const it = ITEMS_DB[Math.floor(Math.random()*ITEMS_DB.length)];
                const cost = it.cost + Math.floor(Game.wave*1.5);
                newItems.push({ type:'item', data:it, cost:cost, bought:false, locked:false });
            }
        }
        this.items = newItems;
        this.renderShop();
    },

    renderShop() {
        const grid = document.getElementById('shopGrid');
        grid.innerHTML = '';
        this.items.forEach((it, idx) => {
            const iconSvg = ICONS[it.data.name] || ICONS.Default;
            const el = document.createElement('div');
            el.className = `shop-card ${it.bought ? 'bought' : ''} ${it.locked ? 'locked' : ''} ${it.type === 'weapon' ? 'tier-'+it.tier : ''}`;
            if(Game.player.mats < it.cost) el.classList.add('expensive');
            
            const color = it.type === 'weapon' ? 'var(--neon-gold)' : 'var(--neon-green)';
            
            el.innerHTML = `
                <div class="lock-btn" onclick="event.stopPropagation(); Shop.toggleLock(${idx})">
                    ${it.locked ? '🔒' : '🔓'}
                </div>
                <div class="icon-box" style="margin-bottom:10px; border-color:${color};">${iconSvg}</div>
                <div style="font-weight:bold; color:${color}; font-size:16px;">${it.data.name}</div>
                <div class="shop-item-desc">${it.data.desc}</div>
                <div style="font-size:20px; font-weight:bold; color:#fff;">$${it.cost}</div>
            `;
            el.onclick = () => this.buy(idx);
            grid.appendChild(el);
        });
    },

    toggleLock(idx) {
        if (this.items[idx].bought) return;
        this.items[idx].locked = !this.items[idx].locked;
        this.renderShop();
    },
    
    buy(idx) {
        const it = this.items[idx];
        if(it.bought || Game.player.mats < it.cost) return;
        
        if(it.type === 'weapon') {
            let mergeIndex = Game.player.weapons.findIndex(w => w.name === it.data.name && w.tier === it.tier && w.tier < 3);
            
            if (mergeIndex === -1 && Game.player.weapons.length >= 6) return; 

            Game.player.mats -= it.cost;
            it.bought = true;
            it.locked = false;
            Sound.play('collect');

            if (mergeIndex !== -1) {
                Game.player.weapons.splice(mergeIndex, 1);
                Game.player.addWeapon(it.data.name, it.tier + 1);
            } else {
                Game.player.addWeapon(it.data.name, it.tier);
            }
        } 
        else {
            Game.player.mats -= it.cost;
            it.bought = true;
            it.locked = false; 
            Sound.play('collect');

            Game.player.items.push(it.data);
            if(it.data.stats) {
                for(let k in it.data.stats) Game.player[k] += it.data.stats[k];
            }
            InventoryUI.renderItems();
        }
        
        this.updateStats(); 
        this.renderShop(); 
        UI.update();
    },
    
    reroll() {
        if(Game.player.mats >= 5) {
            Game.player.mats -= 5;
            this.roll();
            UI.update();
        }
    },
    
    nextWave() {
        Game.wave++;
        Game.spawnRate = Math.max(0.05, 1.0 - (Game.wave * 0.08)); 
        Game.state = 'PLAY';
        Game.timer = 25 + (Game.wave - 1); 
        
        document.getElementById('shopScreen').classList.add('hidden');
        document.getElementById('menuOverlay').classList.add('hidden');
        
        document.querySelectorAll('.sidebar').forEach(s => s.style.display = 'none');
        document.getElementById('mainLayout').style.gridTemplateColumns = '1fr';
        document.getElementById('mainLayout').style.justifyItems = 'center';
        resizeGame();
        
        Game.player.hp = Math.min(Game.player.maxHp, Game.player.hp + Math.ceil(Game.player.maxHp*0.2));
        Sound.play('win');
    },
    
    updateStats() {
        const p = Game.player;
        const s = document.getElementById('statList');
        s.innerHTML = `
            <div class="stat-row"><span class="stat-lbl">MAX HP</span><span class="stat-val">${p.maxHp}</span></div>
            <div class="stat-row"><span class="stat-lbl">REGEN</span><span class="stat-val">${p.hpRegen}/5s</span></div>
            <div class="stat-row"><span class="stat-lbl">ARMOR</span><span class="stat-val">${p.armor}</span></div>
            <div class="stat-row"><span class="stat-lbl">DAMAGE</span><span class="stat-val">+${Math.round((p.dmgMod-1)*100)}%</span></div>
            <div class="stat-row"><span class="stat-lbl">ATK SPD</span><span class="stat-val">+${Math.round((p.atkSpd-1)*100)}%</span></div>
            <div class="stat-row"><span class="stat-lbl">RANGE</span><span class="stat-val">+${Math.round((p.rangeMod-1)*100)}%</span></div>
            <div class="stat-row"><span class="stat-lbl">SPEED</span><span class="stat-val">${Math.round(p.speed)}</span></div>
        `;
    }
};

window.onload = () => Game.init();
</script>
</body>
</html>
