    function triggerRoundOver(loserId) {
        if (gameState === 'UPGRADING' || gameState === 'GAMEOVER') return;
        
        loserIndex = loserId === 1 ? p1 : p2;
        savedLoserId = loserId;
        if (loserId === 1) p2Score++; else p1Score++;
        
        document.getElementById('scoreP1').innerText = p1Score;
        document.getElementById('scoreP2').innerText = p2Score;
        
        if ((p1Score >= WIN_SCORE || p2Score >= WIN_SCORE) && !isEndless) {
            gameState = 'GAMEOVER';
            setTimeout(() => {
                let winner = p1Score > p2Score ? 1 : 2;
                document.getElementById('winTitle').innerText = p1Score > p2Score ? "Player 1 Wins!" : (gameMode === 'pve' ? "AI Wins!" : "Player 2 Wins!");
                document.getElementById('winTitle').style.color = winner === 1 ? '#ff4757' : '#1e90ff';
                document.getElementById('winScreen').style.display = 'flex';
            }, 1000);
            return;
        }

        setTimeout(() => {
            startUpgradePhase(loserId);
        }, 1000);
    }

    function startUpgradePhase(loserId) {
        gameState = 'UPGRADING';
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';
        
        let isAiPicking = (loserId === 2 && gameMode === 'pve');

        if (isAiPicking) {
            document.getElementById('upgradeTitle').innerText = `AI is selecting an upgrade...`;
        } else {
            document.getElementById('upgradeTitle').innerText = `Player ${loserId} Defeated! Pick Your Revenge.`;
        }
        
        document.getElementById('upgradeScreen').style.display = 'flex';
        
        let shuffled = [...cardDeck].sort(() => 0.5 - Math.random());
        let choices = shuffled.slice(0, 4);
        
        choices.forEach(card => {
            let cardEl = document.createElement('div'); cardEl.className = 'card';
            cardEl.innerHTML = `<div class="card-title">${card.title}</div><div class="card-desc">${card.desc}</div><div class="card-stats">${card.statsHTML}</div>`;
            
            if (isAiPicking) {
                cardEl.style.cursor = 'default';
            } else {
                cardEl.onclick = () => {
                    loserIndex.applyCard(card);
                    document.getElementById('upgradeScreen').style.display = 'none';
                    resetRound();
                };
            }
            container.appendChild(cardEl);
        });

        if (isAiPicking) {
            setTimeout(() => {
                let randomAiCard = choices[Math.floor(Math.random() * choices.length)];
                loserIndex.applyCard(randomAiCard);
                document.getElementById('upgradeScreen').style.display = 'none';
                resetRound();
            }, 2500);
        }
    }

    function continueEndless() {
        isEndless = true;
        document.getElementById('winScreen').style.display = 'none';
        startUpgradePhase(savedLoserId);
    }

    const p1 = new Player(100, 100, '#ff4757', { left: 'KeyA', right: 'KeyD', jump: 'KeyW', down: 'KeyS', shoot: 'Space', block: 'ShiftLeft' }, 1);
    const p2 = new Player(800, 100, '#1e90ff', { left: 'ArrowLeft', right: 'ArrowRight', jump: 'ArrowUp', down: 'ArrowDown', shoot: 'Enter', block: 'ShiftRight' }, 2);

    function resetRound() {
        let mapSelection = document.getElementById('mapSelect').value;
        if (mapSelection === 'random') {
            currentMapIndex = Math.floor(Math.random() * maps.length);
        } else {
            currentMapIndex = parseInt(mapSelection);
        }
        
        let m = maps[currentMapIndex];
        canvas.style.backgroundColor = m.color;
        platforms = JSON.parse(JSON.stringify(m.platforms));
        movingPlatforms = m.moving ? JSON.parse(JSON.stringify(m.moving)) : [];
        swingingPlatforms = m.swinging ? JSON.parse(JSON.stringify(m.swinging)) : [];
        jumpPads = m.jumpPads ? JSON.parse(JSON.stringify(m.jumpPads)) : [];
        
        boxes = m.boxes ? m.boxes.map(b => new Box(b)) : [];

        let p1X = m.p1Spawn ? m.p1Spawn.x : 100;
        let p1Y = m.p1Spawn ? m.p1Spawn.y : 100;
        let p2X = m.p2Spawn ? m.p2Spawn.x : 800;
        let p2Y = m.p2Spawn ? m.p2Spawn.y : 100;

        p1.resetPos(p1X, p1Y); 
        p2.resetPos(p2X, p2Y);
        
        bullets = []; particles = []; 
        if (gameState !== 'MAIN_MENU') gameState = 'PLAYING';
        updateUI();
    }

    function updateUI() {
        ['p1', 'p2'].forEach(p => {
            let player = p === 'p1' ? p1 : p2;
            let hpPercent = Math.max(0, (player.health / player.maxHealth) * 100);
            document.getElementById(`${p}Health`).style.width = `${hpPercent}%`;
            document.getElementById(`${p}HealthText`).innerText = `${Math.max(0, Math.ceil(player.health))} / ${player.maxHealth}`;
        });
        document.getElementById('scoreP1').innerText = p1Score;
        document.getElementById('scoreP2').innerText = p2Score;
    }
    function shadeHex(hex, amt) {
        let c = parseInt(hex.slice(1), 16), r = c >> 16, g = (c >> 8) & 255, b = c & 255;
        const f = amt < 0 ? 0 : 255, k = Math.abs(amt);
        return 'rgb(' + Math.round((f - r) * k + r) + ',' + Math.round((f - g) * k + g) + ',' + Math.round((f - b) * k + b) + ')';
    }
    const bgCache = {};
    function mapBackdrop(col) {
        if (bgCache[col]) return bgCache[col];
        const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height; const x = c.getContext('2d');
        const g = x.createLinearGradient(0, 0, 0, c.height); g.addColorStop(0, '#07070d'); g.addColorStop(0.6, shadeHex(col, -0.55)); g.addColorStop(1, shadeHex(col, -0.25));
        x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
        const glow = x.createRadialGradient(c.width / 2, c.height * 0.85, 40, c.width / 2, c.height * 0.85, c.width * 0.7); glow.addColorStop(0, shadeHex(col, 0.15).replace('rgb', 'rgba').replace(')', ',0.35)')); glow.addColorStop(1, 'rgba(0,0,0,0)');
        x.fillStyle = glow; x.fillRect(0, 0, c.width, c.height);
        for (let layer = 0; layer < 2; layer++) {
            x.fillStyle = layer ? shadeHex(col, -0.45) : shadeHex(col, -0.62);
            let px = 0; x.beginPath(); x.moveTo(0, c.height);
            while (px < c.width) { const w = 30 + Math.random() * 60, h = (layer ? 90 : 170) + Math.random() * (layer ? 90 : 140); x.lineTo(px, c.height - h); x.lineTo(px + w, c.height - h); px += w + Math.random() * 8; }
            x.lineTo(c.width, c.height); x.closePath(); x.fill();
            if (!layer) { x.fillStyle = 'rgba(255,220,150,0.25)'; for (let i = 0; i < 90; i++) x.fillRect(Math.random() * c.width, c.height - 40 - Math.random() * 260, 2, 3); }
        }
        x.strokeStyle = 'rgba(255,255,255,0.035)'; x.lineWidth = 1;
        for (let i = 0; i < c.width; i += 40) { x.beginPath(); x.moveTo(i + 0.5, 0); x.lineTo(i + 0.5, c.height); x.stroke(); }
        for (let i = 0; i < c.height; i += 40) { x.beginPath(); x.moveTo(0, i + 0.5); x.lineTo(c.width, i + 0.5); x.stroke(); }
        return (bgCache[col] = c);
    }
    const motes = Array.from({ length: 40 }, () => ({ x: Math.random() * 1024, y: Math.random() * 576, s: 0.2 + Math.random() * 0.6, r: 1 + Math.random() * 2.5 }));
    let mapT = 0;
    function slab(px, py, w, h, base, edge) {
        const g = ctx.createLinearGradient(0, py, 0, py + h); g.addColorStop(0, shadeHex(base, 0.12)); g.addColorStop(1, shadeHex(base, -0.35));
        ctx.fillStyle = g; ctx.fillRect(px, py, w, h);
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(px, py + h - 3, w, 3);
        ctx.shadowColor = edge; ctx.shadowBlur = 12; ctx.fillStyle = edge; ctx.fillRect(px, py, w, 3); ctx.shadowBlur = 0;
    }
    function drawMap() {
        mapT++;
        const currentMapColor = maps[currentMapIndex].color || '#2f3542';
        const edge = shadeHex(currentMapColor, 0.55);
        ctx.drawImage(mapBackdrop(currentMapColor), 0, 0);
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        for (const m of motes) { m.y -= m.s; if (m.y < -5) { m.y = canvas.height + 5; m.x = Math.random() * canvas.width; } ctx.beginPath(); ctx.arc(m.x + Math.sin(mapT * 0.01 + m.y * 0.02) * 6, m.y, m.r, 0, Math.PI * 2); ctx.fill(); }
        ctx.fillStyle = currentMapColor; ctx.fillRect(0, 0, 10, canvas.height); ctx.fillRect(canvas.width - 10, 0, 10, canvas.height);
        ctx.fillStyle = edge; ctx.fillRect(9, 0, 1, canvas.height); ctx.fillRect(canvas.width - 10, 0, 1, canvas.height);
        platforms.forEach(p => {
            if (p.destructible) {
                const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h); g.addColorStop(0, '#9aa7b8'); g.addColorStop(1, '#5a6578');
                ctx.fillStyle = g; ctx.fillRect(p.x, p.y, p.w, p.h);
                ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2; ctx.strokeRect(p.x + 2, p.y + 2, p.w - 4, p.h - 4); ctx.lineWidth = 1;
                ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(p.x, p.y, p.w, 2);
            } else slab(p.x, p.y, p.w, p.h, currentMapColor, edge);
        });
        movingPlatforms.forEach(p => {
            slab(p.x, p.y, p.w, p.h, '#56657d', '#ffd34f');
            ctx.fillStyle = 'rgba(255,211,79,0.8)'; const d = p.vx > 0 ? 1 : -1;
            for (let k = 0; k < 3; k++) { const ax = p.x + p.w / 2 + (k - 1) * 12; ctx.beginPath(); ctx.moveTo(ax + d * 4, p.y + p.h / 2 + 1); ctx.lineTo(ax - d * 3, p.y + p.h / 2 - 4); ctx.lineTo(ax - d * 3, p.y + p.h / 2 + 6); ctx.fill(); }
        });
        swingingPlatforms.forEach(p => {
            p.time++;
            let currentAngle = p.baseAngle + Math.sin(p.time * p.speed) * p.swingArc;
            p.x = p.pivotX + Math.cos(currentAngle) * p.radius - p.w/2;
            p.y = p.pivotY + Math.sin(currentAngle) * p.radius - p.h/2;
            const ex = p.x + p.w / 2, ey = p.y, n = 12;
            ctx.fillStyle = '#c9c4ff';
            for (let k = 0; k <= n; k++) { ctx.beginPath(); ctx.arc(p.pivotX + (ex - p.pivotX) * k / n, p.pivotY + (ey - p.pivotY) * k / n, 2, 0, Math.PI * 2); ctx.fill(); }
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.pivotX, p.pivotY, 5, 0, Math.PI * 2); ctx.fill();
            slab(p.x, p.y, p.w, p.h, '#6c5ce7', '#c9c4ff');
        });
        jumpPads.forEach(p => {
            const g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h); g.addColorStop(0, '#5ff6ff'); g.addColorStop(1, '#008c94');
            ctx.shadowColor = '#00d2d3'; ctx.shadowBlur = 18; ctx.fillStyle = g; ctx.fillRect(p.x, p.y, p.w, p.h); ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2.5;
            for (let k = 0; k < 3; k++) { const yy = p.y - 6 - ((mapT * 0.8 + k * 10) % 30); ctx.globalAlpha = 1 - ((mapT * 0.8 + k * 10) % 30) / 30; ctx.beginPath(); ctx.moveTo(p.x + p.w / 2 - 8, yy + 6); ctx.lineTo(p.x + p.w / 2, yy); ctx.lineTo(p.x + p.w / 2 + 8, yy + 6); ctx.stroke(); }
            ctx.globalAlpha = 1; ctx.lineWidth = 1;
        });
        if (maps[currentMapIndex].hazards) {
            maps[currentMapIndex].hazards.forEach(h => {
                const g = ctx.createLinearGradient(0, h.y, 0, h.y + h.h); g.addColorStop(0, '#ffcf5a'); g.addColorStop(0.25, '#ff6a2a'); g.addColorStop(1, '#8a1a08');
                ctx.shadowColor = '#ff6a2a'; ctx.shadowBlur = 22; ctx.fillStyle = g; ctx.fillRect(h.x, h.y, h.w, h.h); ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff2b0';
                for (let k = 0; k < h.w; k += 16) { const yy = h.y + 2 + Math.sin(mapT * 0.08 + k * 0.3) * 2; ctx.beginPath(); ctx.arc(h.x + k + 8, yy, 2.5, 0, Math.PI * 2); ctx.fill(); }
            });
        }
    }

    function gameLoop(now) {
        if (!VFX.tick60(now)) { requestAnimationFrame(gameLoop); return; }
        currentMapPlatforms = platforms.concat(movingPlatforms).concat(swingingPlatforms);

        if (gameState === 'PLAYING') {
            movingPlatforms.forEach(p => {
                p.x += p.vx;
                if (p.x < p.minX || p.x + p.w > p.maxX) p.vx *= -1;
            });

            for(let i = 0; i < boxes.length; i++) {
                let b1 = boxes[i];
                if (!b1.active) continue;
                for(let j = i + 1; j < boxes.length; j++) {
                    let b2 = boxes[j];
                    if (!b2.active) continue;

                    if (b1.type === 'circle' && b2.type === 'circle') {
                        let dx = b1.x - b2.x; let dy = b1.y - b2.y;
                        let dist = Math.hypot(dx, dy) || 1;
                        let minDist = b1.radius + b2.radius;
                        if (dist < minDist) {
                            let overlap = minDist - dist;
                            let nx = dx/dist; let ny = dy/dist;
                            b1.x += nx * overlap/2; b1.y += ny * overlap/2;
                            b2.x -= nx * overlap/2; b2.y -= ny * overlap/2;
                            let tx = b1.vx; let ty = b1.vy;
                            b1.vx = b2.vx*0.9; b1.vy = b2.vy*0.9;
                            b2.vx = tx*0.9; b2.vy = ty*0.9;
                            if(ny < -0.5) b1.grounded = true;
                            if(ny > 0.5) b2.grounded = true;
                        }
                    } else if (b1.type === 'box' && b2.type === 'box') {
                        let dx = (b1.x + b1.w/2) - (b2.x + b2.w/2);
                        let dy = (b1.y + b1.h/2) - (b2.y + b2.h/2);
                        let aw = (b1.w + b2.w)/2; let ah = (b1.h + b2.h)/2;
                        if (Math.abs(dx) < aw && Math.abs(dy) < ah) {
                            let wy = aw * dy; let hx = ah * dx;
                            if (wy > hx) {
                                if (wy > -hx) { 
                                    b1.y += (ah - dy)/2; b2.y -= (ah - dy)/2;
                                    b1.vy = Math.min(0, b1.vy);
                                    if(Math.abs(b2.vy)<0.5) b2.vy = 0;
                                    b2.grounded = true;
                                } else { 
                                    b1.x -= (aw + dx)/2; b2.x += (aw + dx)/2;
                                    let tx = b1.vx; b1.vx = b2.vx*0.8; b2.vx = tx*0.8;
                                }
                            } else {
                                if (wy > -hx) { 
                                    b1.x += (aw - dx)/2; b2.x -= (aw - dx)/2;
                                    let tx = b1.vx; b1.vx = b2.vx*0.8; b2.vx = tx*0.8;
                                } else { 
                                    b1.y -= (ah + dy)/2; b2.y += (ah + dy)/2;
                                    b1.vy = Math.min(0, b1.vy);
                                    if(Math.abs(b2.vy)<0.5) b2.vy = 0;
                                    b1.grounded = true;
                                }
                            }
                        }
                    } else {
                        let c = b1.type === 'circle' ? b1 : b2;
                        let r = b1.type === 'box' ? b1 : b2;
                        let testX = c.x; let testY = c.y;
                        if (c.x < r.x) testX = r.x; else if (c.x > r.x + r.w) testX = r.x + r.w;
                        if (c.y < r.y) testY = r.y; else if (c.y > r.y + r.h) testY = r.y + r.h;
                        
                        let dx = c.x - testX; let dy = c.y - testY;
                        let dist = Math.hypot(dx, dy);
                        if (dist < c.radius) {
                            let overlap = c.radius - dist;
                            let nx = 0, ny = -1;
                            if (dist === 0) { 
                                let dL = c.x - r.x; let dR = r.x + r.w - c.x;
                                let dT = c.y - r.y; let dB = r.y + r.h - c.y;
                                let min = Math.min(dL, dR, dT, dB);
                                if (min === dT) { nx = 0; ny = -1; overlap = dT + c.radius; }
                                else if (min === dB) { nx = 0; ny = 1; overlap = dB + c.radius; }
                                else if (min === dL) { nx = -1; ny = 0; overlap = dL + c.radius; }
                                else { nx = 1; ny = 0; overlap = dR + c.radius; }
                            } else {
                                nx = dx/dist; ny = dy/dist;
                            }
                            c.x += nx * overlap/2; c.y += ny * overlap/2;
                            r.x -= nx * overlap/2; r.y -= ny * overlap/2;
                            
                            let tx = c.vx; let ty = c.vy;
                            c.vx = r.vx*0.8; c.vy = r.vy*0.8;
                            r.vx = tx*0.8; r.vy = ty*0.8;
                            if(ny < -0.5) c.grounded = true;
                            if(ny > 0.5) r.grounded = true;
                        }
                    }
                }
            }

            p1.update(); p2.update();
            
            // Player-to-Player Collision
            if (p1.health > 0 && p2.health > 0) {
                let dx = (p1.x + p1.width/2) - (p2.x + p2.width/2);
                let dy = (p1.y + p1.height/2) - (p2.y + p2.height/2);
                let aw = (p1.width + p2.width)/2;
                let ah = (p1.height + p2.height)/2;

                if (Math.abs(dx) < aw && Math.abs(dy) < ah) {
                    let overlapX = aw - Math.abs(dx);
                    let overlapY = ah - Math.abs(dy);
                    
                    if (overlapX < overlapY) {
                        let push = overlapX / 2;
                        if (p1.x < p2.x) { p1.x -= push; p2.x += push; }
                        else { p1.x += push; p2.x -= push; }
                        
                        let p1vx = p1.vx;
                        p1.vx = p2.vx * 0.5 + p1.vx * 0.5;
                        p2.vx = p1vx * 0.5 + p2.vx * 0.5;
                    } else {
                        if (p1.y < p2.y) { 
                            p1.y -= overlapY; 
                            if (p1.vy >= 0) {
                                p1.vy = p2.vy;
                                p1.grounded = true;
                                p1.jumpsLeft = p1.maxJumps;
                            }
                        } else { 
                            p2.y -= overlapY; 
                            if (p2.vy >= 0) {
                                p2.vy = p1.vy;
                                p2.grounded = true;
                                p2.jumpsLeft = p2.maxJumps;
                            }
                        }
                    }
                }
            }

            boxes.forEach(b => b.update());
            bullets.forEach(b => b.update());
            
            platforms = platforms.filter(p => !p.markedForDeletion);
            bullets = bullets.filter(b => b.active);
            boxes = boxes.filter(b => b.active && b.health > 0);
        }

        drawMap();
        boxes.forEach(b => b.draw(ctx));
        
        if (gameState === 'PLAYING') {
             particles.forEach(p => p.update());
             particles = particles.filter(p => p.life > 0);
        }
        particles.forEach(p => p.draw(ctx));

        if (gameState === 'PLAYING' || gameState === 'UPGRADING' || gameState === 'GAMEOVER' || gameState === 'PAUSED') {
            p1.draw(ctx); 
            p2.draw(ctx);
            bullets.forEach(b => b.draw(ctx));
        }

        requestAnimationFrame(gameLoop);
    }

    window.focus();
    updateUI(); gameLoop();
</script>
</body>
