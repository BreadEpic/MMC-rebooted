<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Weetabix Runner 2.0</title>
    <link rel="stylesheet" href="v2/fonts.css">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; background-color: #050505; }
        
        /* HUD */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #hud-top {
            position: absolute; top: 20px; left: 20px;
            display: flex; flex-direction: column; gap: 10px;
        }
        
        .bar-wrap {
            width: 300px; height: 30px;
            background: rgba(0,0,0,0.8);
            border: 3px solid #ff4444; /* Red border for danger */
            border-radius: 4px; overflow: hidden; position: relative;
        }
        
        #soggy-fill {
            width: 0%; height: 100%;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
        }

        #boss-hud {
            display: none; width: 600px; height: 40px;
            background: rgba(0,0,0,0.8); border: 3px solid #fff;
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            border-radius: 4px; overflow: hidden;
        }
        #boss-hp {
            width: 100%; height: 100%; background: #ff0000;
            transition: width 0.2s;
        }
        #boss-label {
            position: absolute; top: 40px; width: 100%; text-align: center;
            color: white; font-size: 20px; text-shadow: 2px 2px 0 #000;
        }
        
        #gun-hud {
            display: none;
            position: absolute; top: 100px; left: 20px;
            color: #FFD700; font-size: 30px; 
            text-shadow: 2px 2px 0 #000;
            border: 2px solid #FFD700; padding: 10px; background: rgba(0,0,0,0.5);
        }

        .label {
            position: absolute; width: 100%; text-align: center; top: 4px;
            font-size: 14px; color: #fff; text-shadow: 2px 2px 0 #000;
        }

        #level-indicator {
            font-size: 24px; color: #ff4444; 
            text-shadow: 2px 2px 0px #000;
        }

        /* SCREENS */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at 50% 40%, rgba(60,24,40,.55), rgba(8,4,12,.9)); backdrop-filter: blur(3px);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; z-index: 50; text-align: center; color: white;
        }

        h1 { font: 400 clamp(48px, 9vw, 96px) 'Black Ops One', 'Arial Black', sans-serif; margin: 0; letter-spacing: 2px; text-transform: uppercase;
             background: linear-gradient(180deg, #fff1d6 10%, #e8c28d 50%, #b0783e); -webkit-background-clip: text; background-clip: text; color: transparent;
             filter: drop-shadow(0 6px 0 #3a1c0c) drop-shadow(0 0 30px rgba(255,150,70,.45)); }
        #level-card h1 { -webkit-text-fill-color: #fff; color: #fff; }
        button { box-shadow: 0 0 30px rgba(255,68,68,.35); font-family: 'Black Ops One', 'Arial Black', sans-serif !important; letter-spacing: 2px; }
        h3 { color: #ff4444; font-size: 24px; margin-top: 0; }
        
        .btn-group { display: flex; gap: 20px; }

        button {
            margin-top: 30px; padding: 20px 50px; font-size: 24px; font-weight: 900;
            background: #ff4444; color: white; border: none; cursor: pointer;
            text-transform: uppercase; clip-path: polygon(10% 0, 100% 0, 100% 80%, 90% 100%, 0 100%, 0 20%);
            transition: 0.2s;
        }
        button.blue { background: #4facfe; }
        button:hover { transform: scale(1.1); background: #fff; color: #ff4444; }

        #level-card {
            position: absolute; top: 35%; width: 100%; text-align: center;
            opacity: 0; transition: opacity 0.5s;
        }
        #level-card h1 { font-size: 100px; color: white; text-shadow: 0 10px 30px black; }

    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="hud-top" style="display:none;">
            <div id="level-indicator">ZONE 1</div>
            <div class="bar-wrap">
                <div class="label">SOGGINESS (DEATH IMMINENT)</div>
                <div id="soggy-fill"></div>
            </div>
        </div>
        
        <div id="boss-hud">
            <div id="boss-hp"></div>
            <div class="label" style="z-index:10">MEGA MILK</div>
        </div>

        <div id="gun-hud">PARTS: 0/4</div>

        <div id="level-card"><h1 id="level-title">LEVEL 1</h1></div>
    </div>

    <div id="start-screen" class="screen">
        <h1>Weetabix</h1>
        <h3>Hardcore Edition</h3>
        <p style="color:#888">Spoons crush you. Apples are fast. Milk kills.</p>
        <div class="btn-group">
            <button onclick="startGame(false)">Story Mode</button>
            <button class="blue" onclick="startGame(true)">Infinite</button>
        </div>
    </div>

    <div id="end-screen" class="screen" style="display:none;">
        <h1 id="end-msg">MUSHED</h1>
        <button onclick="location.reload()">Retry</button>
    </div>

    <script src="v2/three.min.js"></script>
    <script src="v2/three-fx.js"></script>
    <script src="v2/vfx.js"></script>

    <script>
        VFX.init({ title: 'Weetabix Runner' });

        // ---- Vectors 2.0 renderer upgrade ----
        let V2 = { composer: null, bloom: null, sky: null, sun: null, follow: null };
        function v2Sky(top, mid, bottom) {
            const c = document.createElement('canvas'); c.width = 16; c.height = 512;
            const x = c.getContext('2d'), g = x.createLinearGradient(0, 0, 0, 512);
            g.addColorStop(0, top); g.addColorStop(0.46, mid); g.addColorStop(0.5, bottom); g.addColorStop(1, bottom);
            x.fillStyle = g; x.fillRect(0, 0, 16, 512);
            const sky = new THREE.Mesh(new THREE.SphereGeometry(450, 32, 16), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), side: THREE.BackSide, fog: false, depthWrite: false }));
            sky.renderOrder = -1; scene.add(sky); V2.sky = sky; return sky;
        }
        function v2Setup(sun, strength, radius, threshold) {
            renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
            V2.sun = sun;
            if (sun) { sun.shadow.mapSize.set(2048, 2048); scene.add(sun.target); V2.sunOff = sun.position.clone(); }
            try {
                V2.composer = new THREE.EffectComposer(renderer);
                V2.composer.addPass(new THREE.RenderPass(scene, camera));
                V2.bloom = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), strength, radius, threshold);
                V2.composer.addPass(V2.bloom);
                V2.composer.setPixelRatio && V2.composer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
            } catch (e) { V2.composer = null; }
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                if (V2.composer) V2.composer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        function v2Render() {
            const f = V2.follow ? V2.follow() : camera.position;
            if (V2.sun && V2.sunOff) { V2.sun.position.set(f.x + V2.sunOff.x, V2.sunOff.y, f.z + V2.sunOff.z); V2.sun.target.position.set(f.x, 0, f.z); }
            if (V2.sky) V2.sky.position.copy(camera.position);
            if (V2.composer && VFX.settings.glow) V2.composer.render(); else renderer['render'](scene, camera);
        }
        // --- TEXTURE GENERATOR ---
        const Textures = {
            createNoise: (c1, c2, scale) => {
                const cvs = document.createElement('canvas');
                cvs.width = 256; cvs.height = 256;
                const ctx = cvs.getContext('2d');
                ctx.fillStyle = c1; ctx.fillRect(0,0,256,256);
                for(let i=0; i<10000; i++) {
                    ctx.fillStyle = Math.random()>0.5 ? c2 : 'rgba(255,255,255,0.1)';
                    const s = Math.random()*scale;
                    ctx.fillRect(Math.random()*256, Math.random()*256, s, s);
                }
                const tex = new THREE.CanvasTexture(cvs);
                tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
                return tex;
            },
            createMetal: () => {
                const cvs = document.createElement('canvas');
                cvs.width = 256; cvs.height = 256;
                const ctx = cvs.getContext('2d');
                const grad = ctx.createLinearGradient(0,0,256,256);
                grad.addColorStop(0, '#aaa'); grad.addColorStop(0.5, '#fff'); grad.addColorStop(1, '#888');
                ctx.fillStyle = grad; ctx.fillRect(0,0,256,256);
                return new THREE.CanvasTexture(cvs);
            },
            createApple: () => {
                const cvs = document.createElement('canvas');
                cvs.width = 128; cvs.height = 128;
                const ctx = cvs.getContext('2d');
                ctx.fillStyle = '#F5F5DC'; 
                ctx.fillRect(0,0,128,128);
                ctx.lineWidth = 10; ctx.strokeStyle = '#8B0000'; 
                ctx.strokeRect(0,0,128,128);
                return new THREE.CanvasTexture(cvs);
            },
            createBox: () => {
                const cvs = document.createElement('canvas');
                cvs.width = 512; cvs.height = 512;
                const ctx = cvs.getContext('2d');
                ctx.fillStyle = '#FFD700'; ctx.fillRect(0,0,512,512);
                ctx.fillStyle = 'white'; ctx.beginPath(); ctx.ellipse(256, 256, 200, 100, 0,0,Math.PI*2); ctx.fill();
                ctx.fillStyle = 'black'; ctx.font='bold 60px sans-serif'; ctx.textAlign='center'; 
                ctx.fillText("WEETABIX", 256, 280);
                return new THREE.CanvasTexture(cvs);
            },
            createBossFace: () => {
                const cvs = document.createElement('canvas');
                cvs.width = 256; cvs.height = 256;
                const ctx = cvs.getContext('2d');
                ctx.fillStyle = '#f0f0f0'; ctx.fillRect(0,0,256,256);
                ctx.fillStyle = '#00f2fe'; ctx.fillRect(0,0,256,60); 
                ctx.fillStyle = 'red';
                ctx.beginPath(); ctx.moveTo(50, 100); ctx.lineTo(100, 100); ctx.lineTo(100, 150); ctx.fill();
                ctx.beginPath(); ctx.moveTo(206, 100); ctx.lineTo(156, 100); ctx.lineTo(156, 150); ctx.fill();
                ctx.strokeStyle = 'black'; ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(50, 200);
                for(let i=0; i<156; i+=10) ctx.lineTo(50+i, 200 + (i%20==0?20:-20));
                ctx.stroke();
                return new THREE.CanvasTexture(cvs);
            }
        };

        // --- GAME CONFIG ---
        const GAME = {
            speed: 0.35, 
            jump: 0.42, 
            gravity: 0.022, 
            biomes: [
                { name: "THE COUNTER", len: 20, type: 'granite', hazardRate: 0.6 },
                { name: "METAL HELL", len: 30, type: 'metal', hazardRate: 0.8 },
                { name: "BOSS: MEGA MILK", len: 400, type: 'boss', hazardRate: 0 } 
            ]
        };

        // --- GLOBALS ---
        let scene, camera, renderer, player, targetBox;
        let floors = [], hazards = [], playerProjectiles = [];
        let keys = {};
        let state = { active: false, level: 0, soggy: 0, time: 0, isInfinite: false, infiniteZ: 0, gunParts: 0, hasGun: false };
        let velocity = new THREE.Vector3();
        let isJumping = false;
        let mats = {};
        let boss = { active: false, mesh: null, cooldown: 0, maxHp: 100, hp: 100, dead: false };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x4a2440);
            scene.fog = new THREE.Fog(0x5a2c40, 16, 66);

            camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 9);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Lights
            const amb = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(amb);
            const dir = new THREE.DirectionalLight(0xffffff, 0.8);
            dir.position.set(5, 20, 5);
            dir.castShadow = true;
            dir.shadow.mapSize.width = 2048;
            dir.shadow.camera.left = -20; dir.shadow.camera.right = 20; dir.shadow.camera.top = 20; dir.shadow.camera.bottom = -20;
            scene.add(dir);
            dir.color.setHex(0xffe2c0); dir.intensity = 1.0; amb.intensity = 0.28;
            scene.add(new THREE.HemisphereLight(0xffb98a, 0x2a1840, 0.45));
            v2Sky('#0c0820', '#d8643a', '#5a2c40');
            v2Setup(dir, 0.5, 0.4, 0.9);
            V2.follow = () => player ? player.position : camera.position;

            // Materials
            mats.player = new THREE.MeshStandardMaterial({ map: Textures.createNoise('#D2B48C', '#8B4513', 2) });
            mats.spoon = new THREE.MeshStandardMaterial({ map: Textures.createMetal(), roughness: 0.2, metalness: 0.9 });
            mats.apple = new THREE.MeshStandardMaterial({ map: Textures.createApple() });
            mats.berry = new THREE.MeshStandardMaterial({ color: 0x191970, roughness: 0.2 });
            mats.milk = new THREE.MeshStandardMaterial({ color: 0xffffff, opacity: 0.8, transparent: true });
            mats.boss = new THREE.MeshStandardMaterial({ map: Textures.createBossFace() });
            mats.gunPart = new THREE.MeshStandardMaterial({ color: 0xFFD700, emissive: 0xffaa00, emissiveIntensity: 0.6, metalness: 0.6, roughness: 0.3 });
            mats.bullet = new THREE.MeshBasicMaterial({ color: 0xFFFF66 });
            mats.rim = { granite: new THREE.MeshBasicMaterial({ color: 0xff8a3d }), metal: new THREE.MeshBasicMaterial({ color: 0x3df2ff }), boss: new THREE.MeshBasicMaterial({ color: 0xff2d55 }), other: new THREE.MeshBasicMaterial({ color: 0xffd34f }) };

            // Player
            player = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.5), mats.player);
            player.castShadow = true;
            player.position.y = 2;
            scene.add(player);

            window.addEventListener('keydown', e => {
                keys[e.code] = true;
                if(e.code === 'KeyE' && state.hasGun && state.active) fireGun();
            });
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('resize', onResize);
            
            animate();
        }

        function startGame(infinite) {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('hud-top').style.display = 'flex';
            state.active = true;
            state.isInfinite = infinite;
            state.infiniteZ = 0;
            state.gunParts = 0;
            state.hasGun = false;
            updateGunHud();
            loadLevel(0);
        }

        function loadLevel(idx) {
            state.level = idx;
            
            let b;
            if (state.isInfinite) {
                 b = { name: "INFINITE CRUNCH", len: 20, type: 'granite', hazardRate: 0.7 };
                 document.getElementById('level-title').innerText = "INFINITE";
                 document.getElementById('gun-hud').style.display = 'none';
            } else {
                b = GAME.biomes[idx];
                document.getElementById('level-title').innerText = b.name;
                // Show Gun HUD only on boss level
                document.getElementById('gun-hud').style.display = (b.type === 'boss') ? 'block' : 'none';
            }
            
            document.getElementById('level-indicator').innerText = state.isInfinite ? "INFINITE" : b.name;

            // Cleanup
            floors.forEach(o => scene.remove(o));
            hazards.forEach(o => scene.remove(o));
            playerProjectiles.forEach(o => scene.remove(o));
            if(boss.mesh) { scene.remove(boss.mesh); boss.mesh = null; }
            if(targetBox) { scene.remove(targetBox); targetBox = null; }
            
            floors = []; hazards = []; playerProjectiles = [];
            boss.active = false; boss.dead = false;
            document.getElementById('boss-hud').style.display = 'none';

            // UI
            const card = document.getElementById('level-card');
            card.style.opacity = 1;
            setTimeout(() => card.style.opacity = 0, 2500);

            // Reset Player
            player.position.set(0, 2, 0);
            velocity.set(0,0,0);
            
            // Generate Initial Floor
            generateFloorChunk(0, b.len, b.type, b.hazardRate, idx);
        }

        function generateFloorChunk(startIdx, count, biomeType, hazardRate, levelIdx) {
            let mat;
            if (biomeType === 'granite') mat = new THREE.MeshStandardMaterial({ map: Textures.createNoise('#333','#555',3) });
            else if (biomeType === 'metal') mat = new THREE.MeshStandardMaterial({ color: 0x556677, metalness: 0.6, roughness: 0.2 });
            else if (biomeType === 'boss') mat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.1, roughness: 0.8 });
            else mat = new THREE.MeshStandardMaterial({ map: Textures.createNoise('#4a3c31','#2a1c11',5) });

            for(let i=0; i<count; i++) {
                const zPos = -((startIdx + i) * 10);
                const floor = new THREE.Mesh(new THREE.BoxGeometry(14, 1, 10), mat);
                floor.position.set(0, -0.5, zPos);
                floor.receiveShadow = true;
                const rimMat = mats.rim[biomeType] || mats.rim.other;
                [-7, 7].forEach(rx => { const rim = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 10), rimMat); rim.position.set(rx, 0.55, 0); floor.add(rim); });
                if (i % 2 === 0) { const st = new THREE.Mesh(new THREE.BoxGeometry(14, 0.04, 0.12), rimMat); st.position.set(0, 0.52, 4.9); st.material = rimMat; floor.add(st); }
                scene.add(floor);
                floors.push(floor);

                // Don't spawn hazards on very first tiles
                if (Math.abs(zPos) > 40 && !boss.active) {
                    if (biomeType !== 'boss') {
                        generateHazards(zPos, hazardRate, levelIdx);
                    }
                }
                
                // --- GUN PART GENERATION (BOSS LEVEL ONLY) ---
                // "Every 50 length" -> 50 units. Each tile is 10 units.
                // So every 5th tile.
                if (biomeType === 'boss' && !state.isInfinite) {
                    // Start spawning parts a bit into the run
                    if (Math.abs(zPos) % 50 === 0 && Math.abs(zPos) > 20 && Math.abs(zPos) <= 250) {
                         spawnGunPart(zPos);
                    }
                }
            }

            const finalZ = -((startIdx + count) * 10);
            
            if (!state.isInfinite) {
                if (biomeType === 'boss') {
                    startBossFight();
                    // NOTE: Exit box is NOT spawned here anymore. It spawns on Boss Death.
                } else {
                    const portal = new THREE.Mesh(new THREE.CylinderGeometry(4,4,0.2,32), new THREE.MeshBasicMaterial({color:0x22ff88}));
                    const ring = new THREE.Mesh(new THREE.TorusGeometry(4.3, 0.25, 12, 48), new THREE.MeshBasicMaterial({ color: 0xaaffdd }));
                    ring.rotation.x = Math.PI / 2; ring.position.y = 0.2; portal.add(ring);
                    portal.position.set(0, 0.1, finalZ);
                    portal.userData = { type: 'portal' };
                    scene.add(portal);
                    hazards.push(portal);
                }
            }
        }

        function startBossFight() {
            boss.active = true;
            boss.hp = 100; boss.maxHp = 100;
            document.getElementById('boss-hud').style.display = 'block';
            document.getElementById('boss-hp').style.width = '100%';
            
            const geom = new THREE.BoxGeometry(8, 14, 4);
            boss.mesh = new THREE.Mesh(geom, mats.boss);
            boss.mesh.position.set(0, 5, player.position.z - 30);
            scene.add(boss.mesh);
        }

        function generateHazards(z, rate, level) {
            const slots = [-4, -2, 0, 2, 4];
            const count = Math.floor(Math.random() * 2) + 1; 
            for(let k=0; k<count; k++) {
                if (Math.random() > rate) continue; 
                const x = slots[Math.floor(Math.random() * slots.length)];
                const r = Math.random();
                if (r < 0.3) spawnHazard('milk', x, z);
                else if (r < 0.6) spawnHazard('berry', x, z);
                else if (r < 0.8 && level > 0) spawnHazard('spoon', x, z);
                else if (level > 1 || state.isInfinite) spawnHazard('apple', x, z);
            }
        }

        function spawnGunPart(z) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), mats.gunPart);
            // Random lane
            const slots = [-4, -2, 0, 2, 4];
            const x = slots[Math.floor(Math.random() * slots.length)];
            mesh.position.set(x, 1.5, z);
            
            // Add animation wrapper
            mesh.userData = { type: 'gunPart', rot: 0 };
            scene.add(mesh);
            hazards.push(mesh);
        }

        function spawnHazard(type, x, z) {
            let mesh;
            if (type === 'milk') {
                mesh = new THREE.Mesh(new THREE.CircleGeometry(2.5, 32), mats.milk);
                mesh.rotation.x = -Math.PI/2;
                mesh.position.set(x, 0.05, z);
            } else if (type === 'berry') {
                mesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), mats.berry);
                mesh.position.set(x, 0.8, z);
                mesh.userData = { dir: Math.random()>0.5?1:-1, speed: 0.15 };
            } else if (type === 'spoon') {
                const g = new THREE.Group();
                const handle = new THREE.Mesh(new THREE.BoxGeometry(0.4, 4, 0.4), mats.spoon);
                const head = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), mats.spoon);
                head.scale.z = 0.3; head.position.y = -2;
                g.add(handle); g.add(head);
                mesh = g;
                mesh.position.set(x, 5, z); 
                mesh.userData = { offset: Math.random() * 100 };
            } else if (type === 'apple') {
                mesh = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.2, 32), mats.apple);
                mesh.rotation.x = Math.PI/2;
                mesh.rotation.z = Math.PI/2;
                mesh.position.set(x, 1.5, z);
                mesh.userData = { dir: Math.random()>0.5?1:-1, speed: 0.4 }; 
            } else if (type === 'boss_shot') {
                mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 8), mats.milk);
                mesh.position.set(x, 2, z);
                mesh.userData = { velX: 0, velZ: 0.8 }; 
            }
            
            if(mesh) {
                mesh.castShadow = true;
                mesh.userData.type = type;
                scene.add(mesh);
                hazards.push(mesh);
            }
        }

        function fireGun() {
            VFX.sfx('laser');
            const bullet = new THREE.Mesh(new THREE.SphereGeometry(0.4), mats.bullet);
            bullet.position.copy(player.position);
            bullet.position.y += 0.5;
            bullet.position.z -= 1.0; 
            bullet.userData = { vel: -1.2 }; // Moves forward faster than player
            scene.add(bullet);
            playerProjectiles.push(bullet);
        }

        function spawnBox(z) {
            targetBox = new THREE.Mesh(new THREE.BoxGeometry(6, 8, 3), new THREE.MeshStandardMaterial({ map: Textures.createBox() }));
            targetBox.position.set(0, 4, z);
            scene.add(targetBox);
        }

        function updateGunHud() {
            const h = document.getElementById('gun-hud');
            if (state.hasGun) {
                h.innerText = "GUN READY! [PRESS E]";
                h.style.color = "#00ff00";
                h.style.borderColor = "#00ff00";
            } else {
                h.innerText = `PARTS: ${state.gunParts}/4`;
                h.style.color = "#FFD700";
                h.style.borderColor = "#FFD700";
            }
        }

        // --- LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            if (!state.active) { v2Render(); return; }

            state.time += 0.05;

            // Physics
            if (keys['KeyW']) velocity.z = -GAME.speed;
            else if (keys['KeyS']) velocity.z = GAME.speed;
            else velocity.z = 0;

            if (keys['KeyA']) velocity.x = -GAME.speed;
            else if (keys['KeyD']) velocity.x = GAME.speed;
            else velocity.x = 0;

            if (keys['Space'] && !isJumping) {
                velocity.y = GAME.jump; VFX.sfx('jump');
                isJumping = true;
            }

            velocity.y -= GAME.gravity;
            player.position.add(velocity);

            // Void Walk Fix
            if (player.position.x < -6) player.position.x = -6;
            if (player.position.x > 6) player.position.x = 6;

            // Floor Collision
            const floorY = (0.9 * player.scale.y) - 0.9;
            if (player.position.y < floorY + 0.9) {
                player.position.y = floorY + 0.9;
                velocity.y = 0;
                isJumping = false;
            }

            // Camera
            camera.position.x += (player.position.x - camera.position.x) * 0.1;
            camera.position.z = player.position.z + 9;
            camera.lookAt(player.position.x, player.position.y, player.position.z - 5);
            player.rotation.z = -velocity.x; 
            
            // Infinite Generation
            if (state.isInfinite) {
                const pZ = Math.abs(player.position.z);
                if (pZ > state.infiniteZ * 10 - 150) {
                    state.infiniteZ += 10;
                    generateFloorChunk(state.infiniteZ, 10, 'metal', 0.8, 2);
                    if (floors.length > 50) { scene.remove(floors.shift()); }
                    if (hazards.length > 40) { scene.remove(hazards.shift()); }
                }
            }

            // Boss Logic
            if (boss.active && boss.mesh && !boss.dead) {
                // Boss stays ahead
                boss.mesh.position.z = player.position.z - 30;
                boss.mesh.position.y = 6 + Math.sin(state.time * 0.5) * 2;
                boss.mesh.rotation.z = Math.sin(state.time) * 0.1;

                boss.cooldown--;
                if (boss.cooldown <= 0) {
                    boss.cooldown = 40;
                    const slots = [-4, -2, 0, 2, 4];
                    const x = slots[Math.floor(Math.random() * slots.length)];
                    spawnHazard('boss_shot', x, boss.mesh.position.z + 2);
                }
            }

            // Projectiles Logic (Bullets)
            for (let i = playerProjectiles.length - 1; i >= 0; i--) {
                const p = playerProjectiles[i];
                p.position.z += p.userData.vel;
                
                // Hit Boss
                if (boss.active && !boss.dead) {
                    const dz = Math.abs(p.position.z - boss.mesh.position.z);
                    const dx = Math.abs(p.position.x - boss.mesh.position.x);
                    if (dz < 2 && dx < 4) {
                        // HIT!
                        boss.hp -= 5; // 20 hits to kill
                        document.getElementById('boss-hp').style.width = boss.hp + '%';
                        
                        scene.remove(p);
                        playerProjectiles.splice(i, 1);
                        
                        if (boss.hp <= 0) {
                            // BOSS DIES
                            boss.dead = true;
                            scene.remove(boss.mesh);
                            document.getElementById('boss-hud').style.display = 'none';
                            spawnBox(player.position.z - 50); // Spawn exit ahead
                        }
                        continue;
                    }
                }
                
                // Cleanup far bullets
                if (Math.abs(p.position.z - player.position.z) > 100) {
                    scene.remove(p);
                    playerProjectiles.splice(i, 1);
                }
            }

            updateHazards();
            v2Render();
        }

        function updateHazards() {
            let inMilk = false;
            const pPos = player.position;

            for (let i = hazards.length - 1; i >= 0; i--) {
                const h = hazards[i];
                
                // Gun Part Animation
                if (h.userData.type === 'gunPart') {
                    h.rotation.y += 0.05;
                    h.rotation.x += 0.05;
                }
                
                // Hazard Movement
                else if (h.userData.type === 'berry') {
                    h.position.x += h.userData.speed * h.userData.dir;
                    h.rotation.z -= 0.2 * h.userData.dir;
                    if (Math.abs(h.position.x) > 6) h.userData.dir *= -1;
                }
                else if (h.userData.type === 'apple') {
                    h.position.x += h.userData.speed * h.userData.dir;
                    h.rotation.x -= 0.4 * h.userData.dir;
                    if (Math.abs(h.position.x) > 6) h.userData.dir *= -1;
                }
                else if (h.userData.type === 'boss_shot') {
                    h.position.z += 0.8; 
                    h.position.y = 1 + Math.abs(Math.sin(state.time * 2));
                    if (h.position.z > player.position.z + 10) {
                        scene.remove(h); hazards.splice(i, 1); continue;
                    }
                }
                else if (h.userData.type === 'spoon') {
                    const y = 3 + Math.sin(state.time + h.userData.offset) * 2.8;
                    h.position.y = Math.max(0.5, y); 
                }

                // Collisions
                const dx = pPos.x - h.position.x;
                const dz = pPos.z - h.position.z;
                const dist = Math.sqrt(dx*dx + dz*dz);

                // Check Pickups
                if (h.userData.type === 'gunPart') {
                    if (dist < 1.5) {
                        scene.remove(h);
                        hazards.splice(i, 1);
                        state.gunParts++;
                        if (state.gunParts >= 4) state.hasGun = true;
                        updateGunHud();
                        continue;
                    }
                }
                // Check Hazards
                else if (h.userData.type === 'milk') {
                    if (dist < 2.5 && pPos.y < 1.2) inMilk = true;
                } 
                else if (h.userData.type === 'berry' && dist < 1.2 && pPos.y < 1.5) {
                    takeHit(10, 0.2);
                }
                else if (h.userData.type === 'boss_shot' && dist < 1.5) {
                    takeHit(15, 0.2);
                    scene.remove(h); hazards.splice(i, 1);
                    continue;
                }
                else if (h.userData.type === 'apple' && dist < 1.6 && pPos.y < 2.0) {
                    takeHit(25, 0.4); 
                }
                else if (h.userData.type === 'spoon' && dist < 1.0 && Math.abs(pPos.y - h.position.y) < 2) {
                    takeHit(50, 0); 
                }
                else if (h.userData.type === 'portal' && dist < 2) {
                    loadLevel(state.level + 1);
                    return;
                }
            }

            if (targetBox && pPos.distanceTo(targetBox.position) < 5) winGame();

            // Sogginess
            if (inMilk) state.soggy += 0.8;
            else if (state.soggy > 0) state.soggy -= 0.05;

            document.getElementById('soggy-fill').style.width = Math.min(state.soggy, 100) + "%";
            if (state.soggy >= 100) gameOver();
            
            // Deform
            const s = state.soggy / 150;
            player.scale.set(1+s, 1-s, 1+s);
        }

        function takeHit(damage, bounce) {
            VFX.sfx('hurt'); VFX.shake(Math.min(14, 4 + damage / 4), 280); VFX.flash('#4facfe', 250);
            state.soggy += damage;
            velocity.y = bounce;
            velocity.z += 0.5; // Knockback
            player.material.color.setHex(0xff0000);
            setTimeout(() => player.material.color.setHex(0xffffff), 100);
        }

        function gameOver() {
            state.active = false; VFX.sfx('lose');
            document.getElementById('end-screen').style.display = 'flex';
            document.getElementById('end-msg').innerText = "CRUMBLED";
            document.getElementById('end-msg').style.color = "#4facfe";
        }
        function winGame() {
            state.active = false; VFX.sfx('win'); VFX.flash('#ffd34f', 500);
            document.getElementById('end-screen').style.display = 'flex';
            document.getElementById('end-msg').innerText = "TASTY VICTORY";
            document.getElementById('end-msg').style.color = "#FFD700";
        }

        function onResize() {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (V2.composer) V2.composer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
