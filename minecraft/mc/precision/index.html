function bootstrapLog(level, msg) {

		return;

	const levelName = ["DEBUG", "INFO", "WARN", "ERROR"][level] || "UNKNOWN";
	const line = "[Precision Client][" + new Date().toISOString() + "][bootstrap/" + levelName + "] " + msg;
	if(level >= 3) {
		console.error(line);
	}else if(level === 2) {
		console.warn(line);
	}else if(level === 1) {
		console.info(line);
	}else {
		console.debug(line);
	}
}

}

/** @type {function(string,number):ArrayBuffer|null} */
var decodeBase64Impl = null;

/**
 * @return {function(string,number):ArrayBuffer}
 */
function createBase64Decoder() {
	const revLookup = [];
	const code = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
	for (var i = 0, len = code.length; i < len; ++i) {
		revLookup[code.charCodeAt(i)] = i;
	}

	revLookup["-".charCodeAt(0)] = 62;
	revLookup["_".charCodeAt(0)] = 63;

	/**
	 * @param {string} b64
	 * @param {number} start
	 * @return {!Array<number>}
	 */
	function getLens(b64, start) {
		const len = b64.length - start;
		if (len % 4 > 0) {
			throw new Error("Invalid string. Length must be a multiple of 4");
		}
		var validLen = b64.indexOf("=", start);
		if (validLen === -1) {
			validLen = len;
		}else {
			validLen -= start;
		}
		const placeHoldersLen = validLen === len ? 0 : 4 - (validLen % 4);
		return [validLen, placeHoldersLen];
	}
	
	/**
	 * @param {string} b64
	 * @param {number} start
	 * @return {ArrayBuffer}
	 */
	function decodeImpl(b64, start) {
		var tmp;
		const lens = getLens(b64, start);
		const validLen = lens[0];
		const placeHoldersLen = lens[1];
		const arr = new Uint8Array(((validLen + placeHoldersLen) * 3 / 4) - placeHoldersLen);
		var curByte = 0;
		const len = (placeHoldersLen > 0 ? validLen - 4 : validLen) + start;
		var i;
		for (i = start; i < len; i += 4) {
			tmp = (revLookup[b64.charCodeAt(i)] << 18) |
				(revLookup[b64.charCodeAt(i + 1)] << 12) |
				(revLookup[b64.charCodeAt(i + 2)] << 6) |
				revLookup[b64.charCodeAt(i + 3)]
			arr[curByte++] = (tmp >> 16) & 0xFF
			arr[curByte++] = (tmp >> 8) & 0xFF
			arr[curByte++] = tmp & 0xFF
		}
		if (placeHoldersLen === 2) {
			tmp = (revLookup[b64.charCodeAt(i)] << 2) |
				(revLookup[b64.charCodeAt(i + 1)] >> 4)
			arr[curByte++] = tmp & 0xFF
		}else if (placeHoldersLen === 1) {
			tmp = (revLookup[b64.charCodeAt(i)] << 10) |
				(revLookup[b64.charCodeAt(i + 1)] << 4) |
				(revLookup[b64.charCodeAt(i + 2)] >> 2)
			arr[curByte++] = (tmp >> 8) & 0xFF
			arr[curByte++] = tmp & 0xFF
		}
		return arr.buffer;
	}
	
	return decodeImpl;
}

/**
 * @param {string} url
 * @param {number} start
 * @return {ArrayBuffer}
 */
function decodeBase64(url, start) {
	if(!decodeBase64Impl) {
		decodeBase64Impl = createBase64Decoder();
	}
	return decodeBase64Impl(url, start);
}

/**
 * @param {string} url
 * @return {!Promise<ArrayBuffer>}
 */
function downloadURL(url) {
	return new Promise(function(resolve) {
		fetch(url, { "cache": "force-cache" })
			.then(function(res) {
				return res.arrayBuffer();
			})
			.then(resolve)
			.catch(function(ex) {
				logError("Failed to fetch URL! " + ex);
				resolve(null);
			});
	});
}

/**
 * precision-client fork: fetch with streaming progress (used for the EPW
 * download so the logo indicator reflects actual network progress). Falls back
 * to a plain arrayBuffer fetch if Content-Length / streams are unavailable.
 * @param {string} url
 * @param {function(number, number)} onProgress called with (receivedBytes, totalBytes)
 * @return {!Promise<ArrayBuffer>}
 */
function downloadURLWithProgress(url, onProgress) {
	return new Promise(function(resolve) {
		fetch(url, { "cache": "force-cache", "mode": "cors" })
			.then(function(res) {
				var total = parseInt(/** @type {string} */ (res.headers.get("Content-Length") || "0"), 10);
				if(res.body && total > 0) {
					var reader = res.body.getReader();
					var received = 0;
					var chunks = [];
					(function pump() {
						reader.read().then(function(result) {
							if(result.done) {
								var arr = new Uint8Array(received);
								var off = 0;
								for(var i = 0; i < chunks.length; ++i) {
									arr.set(chunks[i], off);
									off += chunks[i].length;
								}
								resolve(arr.buffer);
								return;
							}
							chunks.push(result.value);
							received += result.value.length;
							onProgress(received, total);
							pump();
						}).catch(function(ex) {
							logError("Failed to fetch URL! " + ex);
							resolve(null);
						});
					})();
				}else {
					res.arrayBuffer().then(resolve).catch(function(ex) {
						logError("Failed to fetch URL! " + ex);
						resolve(null);
					});
				}
			})
			.catch(function(ex) {
				logError("Failed to fetch URL! " + ex);
				resolve(null);
			});
	});
}

/**
 * @param {string} url
 * @return {!Promise<ArrayBuffer>}
 */
function downloadDataURL(url) {
	if(!url.startsWith("data:application/octet-stream;base64,")) {
		return downloadURL(url);
	}else {
		return new Promise(function(resolve) {
			downloadURL(url).then(function(res) {
				if(res) {
					resolve(res);
				}else {
					logWarn("Failed to decode base64 via fetch, doing it the slow way instead...");
					try {
						resolve(decodeBase64(url, 37));
					}catch(ex) {
						logError("Failed to decode base64! " + ex);
						resolve(null);
					}
				}
			});
		});
	}
}

const PRECISION_LOADING_IMAGE_CELLS = 16;
const PRECISION_LOADING_CELL_PERCENT = 100.0 / PRECISION_LOADING_IMAGE_CELLS;
const PRECISION_LOADING_CONTENT_ORIGIN = 2;
const PRECISION_LOADING_CONTENT_CELLS = 14;
const PRECISION_LOADING_SLOT_COUNT = PRECISION_LOADING_CONTENT_CELLS * PRECISION_LOADING_CONTENT_CELLS;

/**
 * Convert an accepted percentage to a native logo-cell count.
 * The source image is a 16x16 grid; its opaque mark occupies cells 2..15.
 * @param {number} pct
 * @return {number}
 */
function precisionLoadingSlotForProgress(pct) {
	if(!Number.isFinite(pct)) return 0;
	pct = Math.max(0.0, Math.min(100.0, pct));
	return pct >= 100.0 ? PRECISION_LOADING_SLOT_COUNT
			: Math.floor(pct * PRECISION_LOADING_SLOT_COUNT / 100.0);
}

/**
 * Return an orthogonal clip for the completed bottom-up row-major cells.
 * @param {number} slotCount
 * @return {string}
 */
function precisionLoadingCompletedClip(slotCount) {
	slotCount = Math.max(0, Math.min(PRECISION_LOADING_SLOT_COUNT, Math.floor(slotCount)));
	if(slotCount <= 0) return "polygon(0% 100%, 0% 100%, 100% 100%, 100% 100%)";
	if(slotCount >= PRECISION_LOADING_SLOT_COUNT) return "polygon(0% 12.5%, 100% 12.5%, 100% 100%, 0% 100%)";
	const completeRows = Math.floor(slotCount / PRECISION_LOADING_CONTENT_CELLS);
	const activeCells = slotCount % PRECISION_LOADING_CONTENT_CELLS;
	const bottom = 100.0 - completeRows * PRECISION_LOADING_CELL_PERCENT;
	if(activeCells <= 0) {
		return "polygon(0% " + bottom + "%, 100% " + bottom + "%, 100% 100%, 0% 100%)";
	}
	const top = bottom - PRECISION_LOADING_CELL_PERCENT;
	const activeRight = (PRECISION_LOADING_CONTENT_ORIGIN + activeCells) * PRECISION_LOADING_CELL_PERCENT;
	return "polygon(0% " + top + "%, " + activeRight + "% " + top + "%, " + activeRight + "% "
			+ bottom + "%, 100% " + bottom + "%, 100% 100%, 0% 100%)";
}

/**
 * Return the exact next native cell, or a hidden clip after completion.
 * @param {number} slotCount
 * @return {string}
 */
function precisionLoadingFrontierClip(slotCount) {
	slotCount = Math.max(0, Math.min(PRECISION_LOADING_SLOT_COUNT, Math.floor(slotCount)));
	if(slotCount >= PRECISION_LOADING_SLOT_COUNT) return "polygon(0% 100%, 0% 100%, 0% 100%, 0% 100%)";
	const row = Math.floor(slotCount / PRECISION_LOADING_CONTENT_CELLS);
	const column = slotCount % PRECISION_LOADING_CONTENT_CELLS;
	const left = (PRECISION_LOADING_CONTENT_ORIGIN + column) * PRECISION_LOADING_CELL_PERCENT;
	const right = left + PRECISION_LOADING_CELL_PERCENT;
	const bottom = 100.0 - row * PRECISION_LOADING_CELL_PERCENT;
	const top = bottom - PRECISION_LOADING_CELL_PERCENT;
	return "polygon(" + left + "% " + top + "%, " + right + "% " + top + "%, "
			+ right + "% " + bottom + "%, " + left + "% " + bottom + "%)";
}

/**
 * Keep the streamed EPW within its assigned 0-15 progress phase.
 * @param {number} received
 * @param {number} total
 * @return {number}
 */
function precisionLoadingDownloadProgress(received, total) {
	if(!Number.isFinite(received) || !Number.isFinite(total) || total <= 0.0) return 0.0;
	return Math.min(15.0, Math.max(0.0, received / total * 15.0));
}

/**
 * Keep progress targets and their visible native-cell state monotonic.
 * @param {function(number,number):void} onAccepted
 * @return {{set:function(number):number,get:function():number}}
 */
function createPrecisionLoadingProgressController(onAccepted) {
	var accepted = 0.0;
	return {
		set: function(pct) {
			if(!Number.isFinite(pct)) return accepted;
			pct = Math.max(0.0, Math.min(100.0, pct));
			if(pct <= accepted) return accepted;
			accepted = pct;
			if(onAccepted) onAccepted(accepted, precisionLoadingSlotForProgress(accepted));
			return accepted;
		},
		get: function() {
			return accepted;
		}
	};
}
