<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EaglerForge</title>
<link type="image/png" rel="shortcut icon" href="favicon.png" />
<!-- Offline build for MMC:Rebooted. Same files as index.html, but the assets are
     embedded in assets.js as a data URL so nothing has to be fetched from a server. -->
<script type="text/javascript">
"use strict";
(function(){
	const relayId = Math.floor(Math.random() * 3);
	window.eaglercraftXOpts = {
		demoMode: false,
		container: "game_frame",
		worldsDB: "worlds",
		logInvalidCerts: true,
		servers: [],
		relays: [
			{ addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId == 0 },
			{ addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId == 1 },
			{ addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId == 2 }
		]
	};
	var s = new URLSearchParams(location.search).get("server");
	if (s) window.eaglercraftXOpts.joinServer = s;
})();
</script>
<script type="text/javascript" src="ModAPI.js"></script>
<script type="text/javascript" src="ModLoader.js"></script>
<script type="text/javascript" src="ModGUI.js"></script>
<script type="text/javascript" src="classes.js"></script>
<script type="text/javascript" src="assets.js"></script>
<script type="text/javascript">
"use strict";
window.addEventListener("load", function(){ main(); });
</script>
</head>
<body style="margin:0px;width:100vw;height:100vh;overflow:hidden;background:#000;" id="game_frame">
</body>
</html>
